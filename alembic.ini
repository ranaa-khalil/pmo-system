[alembic]
script_location = alembic
prepend_sys_path = .
# Resolved in alembic/env.py: a Config override (tests/CI) wins, then the
# PMO_DATABASE_URL env var, then the app's settings (PostgreSQL in prod,
# SQLite for local dev without Docker).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

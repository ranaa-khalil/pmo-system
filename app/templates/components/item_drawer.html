<!-- Item drawer (§7 #2) — 520px slide-over, the ONLY detail surface in the -->
<!-- product: chips → stepper → description/AC (markdown, #N autolinks) →   -->
<!-- tags → assignees → thread → proofs/sub-items → footer verbs (Edit +    -->
<!-- advance/send-back — the same endpoints as the modal footer). Close =   -->
<!-- Esc or click-out; the list is exactly as left; full-screen on small    -->
<!-- viewports (the phone rule). Write layer: planning.js (Slice 3b).       -->
<div x-show="selectedWorkItem" x-cloak class="fixed inset-0 z-50" style="pointer-events: none;" @keydown.escape.window="closeWorkItem()">
    <div class="absolute inset-0 bg-ink-900/20" @click="closeWorkItem()" style="pointer-events: auto;"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-[520px] bg-white shadow-2xl overflow-y-auto"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         style="pointer-events: auto;">

        <!-- ── NEW-ITEM MODE — the drawer's + New item: capture box + the form fallback ── -->
        <template x-if="workItemNew">
            <div class="flex flex-col min-h-full">
                <div class="sticky top-0 bg-white border-b border-ink-100 px-5 py-3.5 flex items-start justify-between gap-3 z-10">
                    <div class="min-w-0">
                        <div class="text-[11px] font-mono text-ink-400">+ New item</div>
                        <h2 class="text-base font-bold text-ink-900 mt-0.5">Capture or add a work item</h2>
                    </div>
                    <button @click="closeWorkItem()" class="text-ink-400 hover:text-ink-800 p-1 shrink-0">✕</button>
                </div>
                <div class="p-5 space-y-3">
                    {% with box_id = 'drawer-new-item', show_fallback = 'false' %}{% include 'components/capture_box.html' %}{% endwith %}
                    <p class="text-[10px] font-bold uppercase tracking-wider text-ink-400 pt-1">Or add with the form</p>
                    <div class="space-y-2.5">
                        <select x-model="newItemForm.project_id"
                                class="input-premium text-[12px] px-3 py-2 rounded-xl bg-white w-full">
                            <option :value="null" disabled>Pick a project…</option>
                            <template x-for="p in projects" :key="'nf-' + p.id">
                                <option :value="p.id" x-text="p.name"></option>
                            </template>
                        </select>
                        <input x-model="newItemForm.title" placeholder="Item title"
                               class="input-premium text-[13px] px-3 py-2 w-full">
                        <textarea x-model="newItemForm.description" rows="3" placeholder="Description"
                                  class="input-premium text-[13px] px-3 py-2 w-full"></textarea>
                        <div class="grid grid-cols-2 gap-2.5">
                            <select x-model="newItemForm.priority" class="input-premium text-[12px] px-3 py-2 rounded-xl bg-white">
                                <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
                            </select>
                            <select x-model="newItemForm.item_type" class="input-premium text-[12px] px-3 py-2 rounded-xl bg-white">
                                <option>Feature</option><option>Enhancement</option><option>Bug</option><option>Chore</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="sticky bottom-0 bg-white border-t border-ink-100 px-5 py-3 flex items-center gap-2 mt-auto">
                    <button @click="closeWorkItem()" class="text-[12px] text-ink-500 hover:text-ink-700">Cancel</button>
                    <button @click="saveNewItem()" :disabled="!newItemForm.title?.trim() || !newItemForm.project_id"
                            class="ml-auto text-[12px] font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-500 px-4 py-2 rounded-xl hover:opacity-90 transition-all disabled:opacity-40">Add to Requirements</button>
                </div>
            </div>
        </template>

        <!-- ── EXISTING ITEM — view ↔ edit swap in place ── -->
        <template x-if="selectedWorkItem && !workItemNew">
            <div class="flex flex-col min-h-full">
                <!-- Header: #N · project mono + ✕ -->
                <div class="sticky top-0 bg-white border-b border-ink-100 px-5 py-3.5 flex items-start justify-between gap-3 z-10">
                    <div class="min-w-0">
                        <div class="text-[11px] font-mono text-ink-400" x-text="'#' + selectedWorkItem?.id + ' · ' + (selectedWorkItem?.project || '')"></div>
                        <h2 class="text-base font-bold text-ink-900 mt-0.5" x-text="workItemEdit ? workItemEditForm.title : selectedWorkItem?.title"></h2>
                    </div>
                    <button @click="closeWorkItem()" class="text-ink-400 hover:text-ink-800 p-1 shrink-0">✕</button>
                </div>

                <div class="p-5 space-y-4">
                    <!-- Chip row: phase (opens the move menu) / status / priority / type -->
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <div class="relative">
                            <button @click="workItemMoveOpen = !workItemMoveOpen"
                                    class="text-[10px] px-2 py-0.5 rounded-full bg-brand-50 text-brand-600 font-medium hover:bg-brand-100 transition-all flex items-center gap-1"
                                    title="Move to another phase">
                                <span x-text="workCurrentPhase()"></span>
                                <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <!-- Move menu: the phase chip IS the move affordance -->
                            <div x-show="workItemMoveOpen" x-cloak class="absolute left-0 top-full mt-1 w-52 bg-white rounded-xl shadow-lift border border-ink-200/60 p-1.5 z-20" @click.away="workItemMoveOpen = false">
                                <p class="px-2 py-1 text-[10px] font-semibold text-ink-400 uppercase tracking-wider">Move to</p>
                                <template x-for="ph in itemPhases" :key="'mv-' + ph">
                                    <button @click="moveWorkItemTo(ph)"
                                            class="w-full text-left px-2.5 py-1.5 rounded-lg text-[11.5px] font-medium hover:bg-ink-50 flex items-center justify-between gap-2"
                                            :class="ph === workCurrentPhase() ? 'text-accent-600' : 'text-ink-600'">
                                        <span x-text="ph"></span>
                                        <span x-show="ph === workCurrentPhase()" class="text-accent-600">✓</span>
                                    </button>
                                </template>
                                <p class="px-2.5 pt-1.5 pb-1 text-[10px] text-ink-300 leading-snug">Release stages are managed by the release workflow</p>
                            </div>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-medium"
                              :class="(workDetail?.item?.status || selectedWorkItem?.status) === 'Done' ? 'bg-emerald-50 text-emerald-600' : (workDetail?.item?.status || selectedWorkItem?.status) === 'Blocked' ? 'bg-amber-50 text-amber-700' : 'bg-ink-100 text-ink-500'"
                              x-text="workDetail?.item?.status || selectedWorkItem?.status"></span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-ink-100 text-ink-500" x-text="selectedWorkItem?.priority || '—'"></span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-ink-100 text-ink-500" x-show="selectedWorkItem?.item_type" x-text="selectedWorkItem?.item_type"></span>
                        <span class="text-[10px] text-rose-500 font-medium" x-show="selectedWorkItem?.overdue">overdue</span>
                    </div>

                    <!-- Phase stepper: done fill, current ring, future slate; label under current only -->
                    <div>
                        <div class="flex items-center gap-1">
                            <template x-for="(ph, idx) in itemPhases" :key="'st-' + ph">
                                <div class="flex items-center flex-1">
                                    <div class="flex-1 h-1.5 rounded-full transition-colors"
                                         :class="workStepperFill(idx)"></div>
                                    <span x-show="idx < itemPhases.length - 1" class="w-1"></span>
                                </div>
                            </template>
                        </div>
                        <div class="text-[10px] text-ink-400 mt-1" x-text="workCurrentPhase()"></div>
                    </div>

                    <!-- Description + AC (markdown, #N autolinks) — swaps with the edit form -->
                    <template x-if="!workItemEdit">
                        <div class="space-y-3">
                            <div x-show="workDetailLoading" class="text-[11px] text-ink-400">loading…</div>
                            <div>
                                <h3 class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1">Description</h3>
                                <div class="text-[12.5px] text-ink-700 leading-relaxed md-content" x-show="workItemDescription()"
                                     x-html="renderMarkdown(workItemDescription() || '')"></div>
                                <p class="text-[11.5px] text-ink-300 italic" x-show="!workItemDescription()">No description yet — Edit to add one.</p>
                            </div>
                            <div x-show="workItemAcceptance()">
                                <h3 class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1">Acceptance criteria</h3>
                                <div class="text-[12.5px] text-ink-700 leading-relaxed md-content" x-html="renderMarkdown(workItemAcceptance() || '')"></div>
                            </div>
                        </div>
                    </template>

                    <!-- Edit mode: swaps inline in place (interaction rule 4) -->
                    <template x-if="workItemEdit">
                        <div class="space-y-2.5">
                            <h4 class="text-[13px] font-bold text-brand-600">✎ Edit item</h4>
                            <input x-model="workItemEditForm.title" placeholder="Title"
                                   class="input-premium text-[13px] px-3 py-2 w-full">
                            <textarea x-model="workItemEditForm.description" rows="4" placeholder="Description"
                                      class="input-premium text-[13px] px-3 py-2 w-full"></textarea>
                            <p class="text-[9px] text-ink-300 mt-0.5">Supports Markdown — #N autolinks to items</p>
                            <textarea x-model="workItemEditForm.acceptance_criteria" rows="2" placeholder="Acceptance criteria"
                                      class="input-premium text-[13px] px-3 py-2 w-full"></textarea>
                            <div class="grid grid-cols-3 gap-2.5">
                                <select x-model="workItemEditForm.priority" class="input-premium text-[12px] px-2 py-2 rounded-xl bg-white">
                                    <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
                                </select>
                                <select x-model="workItemEditForm.item_type" class="input-premium text-[12px] px-2 py-2 rounded-xl bg-white">
                                    <option value="">Type</option><option>Feature</option><option>Enhancement</option><option>Bug</option><option>Chore</option>
                                </select>
                                <input x-model="workItemEditForm.story_points" type="number" placeholder="Points"
                                       class="input-premium text-[12px] px-2 py-2 rounded-xl">
                            </div>
                            <div class="grid grid-cols-2 gap-2.5">
                                <input x-model="workItemEditForm.target_release" placeholder="Target release"
                                       class="input-premium text-[12px] px-3 py-2 rounded-xl">
                                <input x-model="workItemEditForm.epic" placeholder="Epic"
                                       class="input-premium text-[12px] px-3 py-2 rounded-xl">
                            </div>
                        </div>
                    </template>

                    <!-- Project Brief (AI narrative from live data — kept from the read-only drawer) -->
                    <div x-show="workDetail?.brief" class="surface rounded-xl border border-ink-200/60 p-4 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-0.5 bg-gradient-to-b from-indigo-500 to-violet-500"></div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <svg class="w-3.5 h-3.5 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            <span class="text-[9px] font-bold uppercase tracking-wider text-violet-700">Project Brief</span>
                        </div>
                        <p class="text-[12px] text-ink-600 leading-relaxed" x-text="workDetail?.brief?.narrative || ''"></p>
                    </div>

                    <!-- Tags row — the SAME tag picker, re-hosted (modals/task.html pattern) -->
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1.5">Tags</div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <template x-for="tag in (selectedWorkItem?.tags || [])" :key="'wt-' + tag.id">
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border text-[11px] font-medium" :class="tagChipClass(tag.color)">
                                    <span x-text="'#' + tag.name"></span>
                                    <button type="button" @click="detachWorkItemTag(tag)" class="hover:opacity-60" title="Remove tag">
                                        <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </span>
                            </template>
                            <div class="relative" @click.away="workTagPickerOpen = false">
                                <button type="button" @click="workTagPickerOpen = !workTagPickerOpen"
                                        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-dashed border-ink-300 text-[11px] font-medium text-ink-500 hover:border-brand-400 hover:text-brand-600 transition-colors">
                                    + Add tag
                                </button>
                                <div x-show="workTagPickerOpen" x-cloak class="absolute z-20 mt-1 w-60 rounded-xl border border-ink-200 bg-white shadow-lg p-2.5 left-0">
                                    <input x-model="workTagName" type="text" placeholder="New tag name…" @keydown.enter.prevent="createWorkTagInline()"
                                           class="w-full px-2.5 py-1.5 rounded-lg border border-ink-200 text-[12px] outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 mb-1.5">
                                    <div class="flex items-center gap-1.5 mb-2">
                                        <template x-for="c in ['indigo', 'violet', 'blue', 'emerald', 'amber', 'rose', 'slate']" :key="'wtc-' + c">
                                            <button type="button" @click="workTagColor = c" class="w-4 h-4 rounded-full border border-black/10 transition-all"
                                                    :class="[tagDotClass(c), workTagColor === c ? 'ring-2 ring-offset-1 ring-brand-300' : '']"></button>
                                        </template>
                                    </div>
                                    <div class="max-h-40 overflow-y-auto space-y-0.5">
                                        <template x-for="tag in tagPool" :key="'wtp-' + tag.id">
                                            <button type="button" @click="attachWorkItemTag(tag)" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-ink-50 text-left transition-colors">
                                                <span class="w-2 h-2 rounded-full flex-shrink-0" :class="tagDotClass(tag.color)"></span>
                                                <span class="text-[12px] font-medium text-ink-700 flex-1" x-text="'#' + tag.name"></span>
                                                <span class="text-[10px] text-ink-300" x-text="(tag.item_count + tag.task_count) + ' uses'"></span>
                                            </button>
                                        </template>
                                        <div x-show="tagPool.length === 0" class="text-[11px] text-ink-300 px-2 py-1.5">Type a name to create the first tag.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Assignees row — the same toggle picker (single assignee on backlog items) -->
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1.5">Assignee</div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <template x-if="selectedWorkItem?.assigned_to_name">
                                <span class="inline-flex items-center gap-1.5 pl-1 pr-2 py-0.5 rounded-full bg-ink-100 text-[11px] font-medium text-ink-700">
                                    <span class="w-5 h-5 rounded-full text-[9px] font-bold text-white flex items-center justify-center"
                                          :class="avatarColor(selectedWorkItem?.assigned_to_name || '?')"
                                          x-text="(selectedWorkItem?.assigned_to_name || '?').split(' ').map(w => w[0]).join('').slice(0, 2)"></span>
                                    <span x-text="selectedWorkItem?.assigned_to_name"></span>
                                    <button type="button" @click="setWorkItemAssignee(null)" class="text-ink-400 hover:text-rose-500 transition-colors" title="Unassign">
                                        <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </span>
                            </template>
                            <div class="relative" @click.away="workAssigneeOpen = false">
                                <button type="button" @click="workAssigneeOpen = !workAssigneeOpen"
                                        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-dashed border-ink-300 text-[11px] font-medium text-ink-500 hover:border-brand-400 hover:text-brand-600 transition-colors">
                                    <span x-text="selectedWorkItem?.assigned_to_name ? 'Change' : 'Assign'"></span>
                                </button>
                                <div x-show="workAssigneeOpen" x-cloak class="absolute z-20 mt-1 w-56 rounded-xl border border-ink-200 bg-white shadow-lg p-2 left-0 max-h-48 overflow-y-auto">
                                    <template x-for="u in users" :key="'wau-' + u.id">
                                        <button type="button" @click="setWorkItemAssignee(u.id)" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-ink-50 text-left transition-colors">
                                            <span class="w-5 h-5 rounded-full text-[8px] font-bold text-white flex items-center justify-center flex-shrink-0" :class="avatarColor(u.name || '?')"
                                                  x-text="(u.name || '?').split(' ').map(w => w[0]).join('').slice(0, 2)"></span>
                                            <span class="text-[12px] font-medium text-ink-700 flex-1" x-text="u.name"></span>
                                            <svg x-show="selectedWorkItem?.assigned_to === u.id" class="w-3.5 h-3.5 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                        </button>
                                    </template>
                                    <div x-show="users.length === 0" class="text-[11px] text-ink-300 px-2 py-1.5">No members loaded yet.</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Comment thread — append-only, input pinned at the block bottom, Enter posts -->
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1.5">
                            Comments <span x-show="workItemComments.length > 0" x-text="'(' + workItemComments.length + ')'"></span>
                        </div>
                        <div class="space-y-2.5 max-h-56 overflow-y-auto mb-2">
                            <template x-for="c in workItemComments" :key="'wc-' + c.id">
                                <div class="flex items-start gap-2">
                                    <span class="w-6 h-6 rounded-full text-[9px] font-bold text-white flex items-center justify-center flex-shrink-0 mt-0.5" :class="avatarColor(c.user_name || '?')"
                                          x-text="(c.user_name || '?').split(' ').map(w => w[0]).join('').slice(0, 2)"></span>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2">
                                            <span class="text-[11px] font-semibold text-ink-700" x-text="c.user_name || ('User #' + c.user_id)"></span>
                                            <span class="text-[10px] text-ink-300" x-text="(c.created_at || '').slice(0, 16).replace('T', ' ')"></span>
                                        </div>
                                        <p class="text-[12px] text-ink-600 whitespace-pre-wrap" x-text="c.body"></p>
                                    </div>
                                </div>
                            </template>
                            <div x-show="workItemComments.length === 0" class="text-[11px] text-ink-300">No comments yet — start the discussion.</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <input x-model="workItemCommentForm" type="text" placeholder="Add a comment…" @keydown.enter.prevent="postWorkItemComment()"
                                   class="flex-1 min-w-0 px-3 py-1.5 rounded-lg border border-ink-200 text-[12px] bg-white outline-none focus:ring-2 focus:ring-brand-400">
                            <button @click="postWorkItemComment()" class="px-2.5 py-1.5 rounded-lg bg-brand-600 text-white text-[11px] font-semibold hover:bg-brand-700 transition-colors">Post</button>
                        </div>
                    </div>

                    <!-- Proofs / sub-items -->
                    <div class="grid grid-cols-2 gap-3" x-show="workItemProofs.length > 0 || workItemSubitems.length > 0">
                        <div x-show="workItemProofs.length > 0">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1.5" x-text="'Proofs (' + workItemProofs.length + ')'"></div>
                            <div class="space-y-1">
                                <template x-for="pr in workItemProofs" :key="'wpr-' + pr.id">
                                    <div class="flex items-center gap-1.5 text-[11.5px] text-ink-600">
                                        <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="pr.status === 'Approved' ? 'bg-emerald-500' : 'bg-amber-400'"></span>
                                        <span class="truncate" x-text="pr.title"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div x-show="workItemSubitems.length > 0">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1.5" x-text="'Sub-items (' + workItemSubitems.length + ')'"></div>
                            <div class="space-y-1">
                                <template x-for="sub in workItemSubitems" :key="'wsub-' + sub.id">
                                    <div class="flex items-center gap-1.5 text-[11.5px] text-ink-600">
                                        <span class="font-mono text-[10px] text-ink-300 shrink-0" x-text="'#' + sub.id"></span>
                                        <span class="truncate" x-text="sub.title"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer: view mode → Close | Open in Projects | Edit + phase verbs -->
                <template x-if="!workItemEdit">
                    <div class="sticky bottom-0 bg-white border-t border-ink-100 px-5 py-3 flex items-center gap-2 mt-auto">
                        <button @click="closeWorkItem()" class="text-[12px] text-ink-500 hover:text-ink-700">Close</button>
                        <button @click="openProjectById(selectedWorkItem?.project_id)"
                                class="text-[11.5px] font-medium text-brand-700 border border-brand-200 bg-white px-3 py-1.5 rounded-xl hover:bg-brand-50 transition-all">Open in Projects</button>
                        <div class="flex items-center gap-2 ml-auto">
                            <button x-show="workCurrentPhase() === 'Testing'" @click="sendBackWorkItem(selectedWorkItem?.id)"
                                    class="text-[11.5px] font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition-all">↩ Send back to Dev</button>
                            <button @click="startWorkItemEdit()"
                                    class="text-[11.5px] font-medium text-brand-600 bg-brand-50 hover:bg-brand-100 px-3 py-1.5 rounded-lg transition-all">✏ Edit</button>
                            <button x-show="workAdvanceAllowed()" @click="advanceWorkItem(selectedWorkItem?.id)"
                                    class="text-[11.5px] font-medium text-white btn-primary px-3 py-1.5 rounded-lg transition-all" x-text="workAdvanceLabel()"></button>
                            <span x-show="workCurrentPhase() === 'Ready for UAT'" class="text-[10.5px] text-emerald-600 font-medium">✓ Ready for UAT — add to a release</span>
                        </div>
                    </div>
                </template>
                <!-- Footer: edit mode → Save | Cancel -->
                <template x-if="workItemEdit">
                    <div class="sticky bottom-0 bg-white border-t border-ink-100 px-5 py-3 flex items-center gap-2 mt-auto">
                        <button @click="workItemEdit = false" class="text-[12px] text-ink-500 hover:text-ink-700">Cancel</button>
                        <button @click="saveWorkItemEdit()"
                                class="ml-auto text-[12px] font-semibold text-white bg-gradient-to-r from-indigo-500 to-violet-500 px-4 py-2 rounded-xl hover:opacity-90 transition-all">Save Changes</button>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>

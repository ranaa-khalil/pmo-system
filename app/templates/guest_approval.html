<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Review — PMO System</title>
    <script nonce="{{ csp_nonce }}" src="/static/tailwind.min.js"></script>
    <script nonce="{{ csp_nonce }}" src="/static/js/app/tailwind-config.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-ink-50 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2 text-[13px]">
                <span class="text-ink-400 font-medium">PMO System</span>
                <span class="text-ink-300">›</span>
                <span class="text-ink-700 font-semibold">Approval review</span>
            </div>
            <span id="expires" class="text-[11px] text-ink-400"></span>
        </div>

        <!-- Error state -->
        <div id="error" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center">
            <p class="text-[15px] font-semibold text-rose-700" id="error-title">Link not available</p>
            <p class="text-[13px] text-rose-500 mt-1" id="error-body"></p>
        </div>

        <!-- Loading -->
        <div id="loading" class="bg-white border border-ink-200/60 rounded-2xl p-10 text-center">
            <p class="text-[13px] text-ink-400">Loading approval…</p>
        </div>

        <!-- Content -->
        <div id="content" class="hidden space-y-5">
            <div class="bg-white border border-ink-200/60 rounded-2xl p-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h1 class="text-[20px] font-bold text-ink-900 tracking-tight" id="req-title"></h1>
                        <p class="text-[13px] text-ink-500 mt-1">
                            <span id="req-project"></span> · <span id="req-type"></span>
                        </p>
                    </div>
                    <span id="req-status" class="text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wide"></span>
                </div>
                <p class="text-[13px] text-ink-600 mt-3" id="req-desc"></p>
            </div>

            <!-- Approval chain -->
            <div class="bg-white border border-ink-200/60 rounded-2xl p-6">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-3">Approval chain</h2>
                <div id="steps" class="space-y-2"></div>
            </div>

            <!-- Guest decisions so far -->
            <div id="decisions-card" class="bg-white border border-ink-200/60 rounded-2xl p-6 hidden">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-3">Guest feedback</h2>
                <div id="decisions" class="space-y-2"></div>
            </div>

            <!-- Decide form -->
            <div id="form-card" class="bg-white border border-ink-200/60 rounded-2xl p-6">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-1">Your review</h2>
                <p class="text-[12px] text-ink-400 mb-4" id="bound-note"></p>
                <div class="space-y-3">
                    <div id="password-row" class="hidden">
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Link password</label>
                        <input id="password" type="password" placeholder="Enter the password you were given"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400">
                    </div>
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Your name</label>
                        <input id="guest-name" type="text" placeholder="e.g. Dana from ACME"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400">
                    </div>
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Comment <span class="text-ink-400 font-normal">(optional)</span></label>
                        <textarea id="comment" rows="3" placeholder="Add context for your decision…"
                                  class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 resize-none"></textarea>
                    </div>
                    <div id="form-error" class="hidden text-[12px] text-rose-600"></div>
                    <div class="flex items-center gap-2 pt-1">
                        <button id="approve" class="flex-1 px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-[13px] font-semibold hover:bg-emerald-700 transition-colors disabled:opacity-50">Approve</button>
                        <button id="reject" class="flex-1 px-4 py-2.5 rounded-xl bg-rose-600 text-white text-[13px] font-semibold hover:bg-rose-700 transition-colors disabled:opacity-50">Reject</button>
                    </div>
                </div>
            </div>

            <!-- Done state -->
            <div id="done" class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center">
                <p class="text-[15px] font-semibold text-emerald-700">Thank you — your decision was recorded.</p>
                <p class="text-[12px] text-emerald-600 mt-1">The project team has been notified.</p>
            </div>

            <p class="text-[11px] text-ink-300 text-center pt-2">Shared from PMO System</p>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}">
    const TOKEN = window.location.pathname.split('/').pop();
    const $ = (id) => document.getElementById(id);

    async function load() {
        try {
            const res = await fetch(`/api/guest/approvals/${TOKEN}`);
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                $('loading').classList.add('hidden');
                $('error').classList.remove('hidden');
                $('error-title').textContent = res.status === 410 ? 'This link has expired or was revoked' : 'Link not available';
                $('error-body').textContent = err.detail || '';
                return;
            }
            const data = await res.json();
            render(data);
        } catch (e) {
            $('loading').classList.add('hidden');
            $('error').classList.remove('hidden');
            $('error-body').textContent = 'Could not load this approval.';
        }
    }

    function statusClass(s) {
        if (s === 'Approved') return 'bg-emerald-50 text-emerald-600';
        if (s === 'Rejected') return 'bg-rose-50 text-rose-600';
        return 'bg-ink-100 text-ink-500';
    }

    function render(data) {
        $('loading').classList.add('hidden');
        $('content').classList.remove('hidden');
        $('req-title').textContent = data.request.title;
        $('req-project').textContent = data.request.project_name || '—';
        $('req-type').textContent = (data.request.request_type || '').replace(/_/g, ' ');
        const st = $('req-status');
        st.textContent = data.request.status;
        st.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wide ' + statusClass(data.request.status);
        $('req-desc').textContent = data.request.description || '';
        if (data.expires_at) {
            $('expires').textContent = 'Link expires ' + new Date(data.expires_at).toLocaleDateString();
        }
        $('steps').innerHTML = data.steps.map(s => `
            <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-ink-100">
                <div class="flex items-center gap-2.5">
                    <span class="w-6 h-6 rounded-lg bg-ink-100 text-ink-500 text-[11px] font-bold flex items-center justify-center">${s.step_order}</span>
                    <span class="text-[13px] font-medium text-ink-800">${s.role_name}</span>
                </div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide ${statusClass(s.status)}">${s.status}</span>
            </div>`).join('');
        if (data.guest_decisions.length) {
            $('decisions-card').classList.remove('hidden');
            $('decisions').innerHTML = data.guest_decisions.map(d => `
                <div class="px-3.5 py-2.5 rounded-xl bg-ink-50">
                    <div class="flex items-center justify-between">
                        <span class="text-[12px] font-semibold text-ink-700">${d.guest_name || 'Guest'}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${statusClass(d.decision)}">${d.decision}</span>
                    </div>
                    ${d.comment ? `<p class="text-[12px] text-ink-500 mt-1">${d.comment}</p>` : ''}
                </div>`).join('');
        }
        if (data.has_password) $('password-row').classList.remove('hidden');
        if (data.bound_step) {
            $('bound-note').textContent = `Your decision applies to step ${data.bound_step.step_order} (${data.bound_step.role_name}).`;
        }
        if (!data.can_decide) {
            $('form-card').classList.add('hidden');
        }
        $('approve').addEventListener('click', () => decide('Approved'));
        $('reject').addEventListener('click', () => decide('Rejected'));
    }

    async function decide(decision) {
        const body = {
            decision,
            guest_name: $('guest-name').value.trim() || undefined,
            comment: $('comment').value.trim() || undefined,
        };
        if ($('password-row').classList.contains('hidden') === false) {
            body.password = $('password').value;
        }
        $('approve').disabled = true;
        $('reject').disabled = true;
        $('form-error').classList.add('hidden');
        try {
            const res = await fetch(`/api/guest/approvals/${TOKEN}/decide`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                $('form-error').textContent = err.detail || 'Could not record your decision.';
                $('form-error').classList.remove('hidden');
                $('approve').disabled = false;
                $('reject').disabled = false;
                return;
            }
            $('form-card').classList.add('hidden');
            $('done').classList.remove('hidden');
            load();  // refresh the chain view
        } catch (e) {
            $('form-error').textContent = 'Network error — try again.';
            $('form-error').classList.remove('hidden');
            $('approve').disabled = false;
            $('reject').disabled = false;
        }
    }

    load();
    </script>
</body>
</html>

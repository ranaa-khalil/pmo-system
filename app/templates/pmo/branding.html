    <script nonce="{{ csp_nonce }}">
        window.__TENANT_BRANDING = {{ tenant_branding | tojson if tenant_branding else 'null' }};
        window.__TENANT_SLUG = "{{ tenant_slug or '' }}";

        // Apply branding CSS variables as early as possible
        (function() {
            var b = window.__TENANT_BRANDING;
            if (b && b.primary_color) {
                var hex = b.primary_color;
                // Convert hex to RGB
                var r = parseInt(hex.slice(1,3), 16);
                var g = parseInt(hex.slice(3,5), 16);
                var bl = parseInt(hex.slice(5,7), 16);
                document.documentElement.style.setProperty('--brand-r', r);
                document.documentElement.style.setProperty('--brand-g', g);
                document.documentElement.style.setProperty('--brand-b', bl);
                document.documentElement.style.setProperty('--brand-color', hex);
            }
            if (b && b.app_name) {
                document.title = b.app_name + ' — PMO System';
            }
        })();
    </script>

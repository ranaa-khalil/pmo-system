<!-- ==================== AI SUGGESTION MODAL ==================== -->
<div x-show="aiModalOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm" @keydown.escape.window="aiModalOpen = false">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto modal-enter" @click.stop>
        <!-- Header -->
        <div class="sticky top-0 bg-white border-b border-black/[0.06] px-6 py-4 flex items-center justify-between gap-3 z-10">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-brand-500 to-violet-600 flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                </div>
                <h3 class="text-[15px] font-bold text-ink-800" x-text="aiModalTitle"></h3>
            </div>
            <button @click="aiModalOpen = false" class="text-ink-400 hover:text-ink-600">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Body -->
        <div class="px-6 py-5 space-y-4">
            <!-- Loading state -->
            <template x-if="aiLoading">
                <div class="flex flex-col items-center justify-center py-16">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-100 to-violet-100 flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-brand-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>
                    </div>
                    <p class="text-[13px] text-ink-500 font-medium">AI is analyzing your project...</p>
                    <p class="text-[11px] text-ink-400 mt-1">This usually takes 5-15 seconds</p>
                </div>
            </template>

            <!-- Error state -->
            <template x-if="!aiLoading && aiModalContent?.error">
                <div class="bg-rose-50 border border-rose-200 rounded-xl p-4">
                    <div class="flex items-center gap-2 text-rose-600 text-[13px] font-medium">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        Error
                    </div>
                    <p class="text-[12px] text-rose-500 mt-1" x-text="aiModalContent.error"></p>
                </div>
            </template>

            <!-- Vision suggestion -->
            <template x-if="!aiLoading && aiModalContent && !aiModalContent.error && aiModalType === 'vision'">
                <div class="space-y-4">
                    <!-- Improved vision -->
                    <div class="bg-brand-50/40 border border-brand-100 rounded-xl p-4">
                        <div class="text-[10px] font-semibold text-brand-600 uppercase tracking-wider mb-2">Improved Vision</div>
                        <p class="text-[14px] text-ink-800 leading-relaxed" x-text="aiModalContent.improved_vision"></p>
                    </div>
                    <!-- Strengths -->
                    <div x-show="aiModalContent.strengths?.length">
                        <div class="text-[12px] font-semibold text-ink-700 mb-1.5">What works well</div>
                        <ul class="space-y-1">
                            <template x-for="s in (aiModalContent.strengths || [])" :key="s">
                                <li class="flex items-start gap-2 text-[12px] text-ink-600">
                                    <svg class="w-3.5 h-3.5 text-emerald-500 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                    <span x-text="s"></span>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <!-- Improvements -->
                    <div x-show="aiModalContent.improvements?.length">
                        <div class="text-[12px] font-semibold text-ink-700 mb-1.5">Suggested improvements</div>
                        <ul class="space-y-1">
                            <template x-for="s in (aiModalContent.improvements || [])" :key="s">
                                <li class="flex items-start gap-2 text-[12px] text-ink-600">
                                    <svg class="w-3.5 h-3.5 text-amber-500 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01"/></svg>
                                    <span x-text="s"></span>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <!-- Suggested objectives -->
                    <div x-show="aiModalContent.suggested_objectives?.length">
                        <div class="text-[12px] font-semibold text-ink-700 mb-1.5">Suggested strategic objectives</div>
                        <div class="space-y-1.5">
                            <template x-for="(s, idx) in (aiModalContent.suggested_objectives || [])" :key="idx">
                                <div class="flex items-start gap-2 text-[12px] text-ink-600 bg-ink-50 rounded-lg px-3 py-2">
                                    <span class="text-[10px] font-bold text-brand-600 mt-0.5" x-text="(idx+1)+'.'"></span>
                                    <span x-text="s"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Feature suggestions -->
            <template x-if="!aiLoading && aiModalContent && !aiModalContent.error && aiModalType === 'features'">
                <div class="space-y-3">
                    <!-- Summary -->
                    <div x-show="aiModalContent.summary" class="bg-brand-50/40 border border-brand-100 rounded-xl p-3">
                        <div class="text-[10px] font-semibold text-brand-600 uppercase tracking-wider mb-1">AI Assessment</div>
                        <div class="text-[12px] text-ink-700 leading-relaxed prose-p:my-1" x-html="renderMarkdown(aiModalContent.summary)"></div>
                    </div>

                    <!-- Approve all bar -->
                    <div class="flex items-center justify-between bg-ink-50 rounded-xl px-3 py-2">
                        <span class="text-[11px] text-ink-500">Review each suggestion — approve or decline individually.</span>
                        <button @click="approveAllFeatureSuggestions()" class="text-[11px] font-semibold text-white btn-primary px-3 py-1.5 rounded-lg transition-all">Approve All</button>
                    </div>

                    <!-- ============ GROUPED: EPICS WITH THEIR FEATURES ============ -->
                    <template x-for="(group, gIdx) in aiGroupedSuggestions" :key="'group_'+gIdx">
                        <div class="space-y-1.5">
                            <!-- Epic header -->
                            <template x-if="group.epic">
                                <div class="border-l-[3px] rounded-r-xl overflow-hidden transition-all"
                                     :class="aiSuggestionStatus['epic_'+group.epicIdx] === 'approved' ? 'border-emerald-500 bg-emerald-50/30' : aiSuggestionStatus['epic_'+group.epicIdx] === 'declined' ? 'border-ink-300 bg-ink-50/30 opacity-50' : aiSuggestionStatus['epic_'+group.epicIdx] === 'adding' ? 'border-brand-500 bg-brand-50/20 ring-1 ring-brand-100' : 'border-violet-500 bg-violet-50/20'">
                                    <div class="px-4 py-2.5 flex items-start justify-between gap-3">
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-2 mb-0.5">
                                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 uppercase tracking-wider">Epic</span>
                                                <span class="text-[9px] text-ink-400" x-text="group.features.length + ' features'"></span>
                                            </div>
                                            <h3 class="text-[14px] font-bold text-ink-800 leading-tight" x-text="group.epic.title"></h3>
                                            <div class="text-[11px] text-ink-500 leading-relaxed mt-0.5 prose-p:my-0.5" x-html="renderMarkdown(group.epic.description)"></div>
                                        </div>
                                        <div class="flex-shrink-0 flex items-center gap-1.5">
                                            <button x-show="!aiSuggestionStatus['epic_'+group.epicIdx] || aiSuggestionStatus['epic_'+group.epicIdx]==='pending'" @click="approveFeatureSuggestion(group.epicIdx,'epic')" class="text-[10px] font-semibold text-white bg-emerald-500 hover:bg-emerald-600 px-2.5 py-1 rounded-md transition-all">Approve</button>
                                            <button x-show="!aiSuggestionStatus['epic_'+group.epicIdx] || aiSuggestionStatus['epic_'+group.epicIdx]==='pending'" @click="declineFeatureSuggestion(group.epicIdx,'epic')" class="text-[10px] font-medium text-ink-400 hover:text-ink-700 px-2 py-1 rounded-md hover:bg-ink-100 transition-all">Decline</button>
                                            <span x-show="aiSuggestionStatus['epic_'+group.epicIdx]==='adding'" class="text-[10px] text-brand-600 font-medium">Adding...</span>
                                            <span x-show="aiSuggestionStatus['epic_'+group.epicIdx]==='approved'" class="text-[10px] text-emerald-600 font-semibold">✓ Added</span>
                                            <span x-show="aiSuggestionStatus['epic_'+group.epicIdx]==='declined'" class="text-[10px] text-ink-400">Declined</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template x-if="!group.epic">
                                <div class="text-[11px] font-semibold text-ink-500 uppercase tracking-wider py-1">Features for existing epics</div>
                            </template>

                            <!-- Features under this epic -->
                            <template x-for="(feat, fIdx) in group.features" :key="'feat_'+feat._origIdx">
                                <div class="border-l-[3px] rounded-r-xl ml-3 overflow-hidden transition-all"
                                     :class="aiSuggestionStatus['feature_'+feat._origIdx] === 'approved' ? 'border-emerald-500 bg-emerald-50/20' : aiSuggestionStatus['feature_'+feat._origIdx] === 'declined' ? 'border-ink-300 bg-ink-50/20 opacity-50' : aiSuggestionStatus['feature_'+feat._origIdx] === 'adding' ? 'border-brand-500 ring-1 ring-brand-100' : aiSuggestionStatus['feature_'+feat._origIdx] === 'error' ? 'border-rose-400' : 'border-blue-400/60 bg-white'">
                                    <!-- Feature header: title + badges + actions in one compact bar -->
                                    <div class="px-4 py-2 flex items-start justify-between gap-2">
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-1.5 mb-0.5 flex-wrap">
                                                <span class="text-[9px] font-medium px-1.5 py-0.5 rounded bg-blue-50 text-blue-600" x-text="feat.item_type || 'Feature'"></span>
                                                <span class="text-[9px] font-medium px-1.5 py-0.5 rounded" :class="feat.priority==='Critical' ? 'bg-rose-50 text-rose-600' : feat.priority==='High' ? 'bg-rose-50 text-rose-600' : feat.priority==='Medium' ? 'bg-amber-50 text-amber-600' : 'bg-ink-100 text-ink-500'" x-text="feat.priority || 'Medium'"></span>
                                                <span class="text-[9px] text-ink-400" x-text="(feat.story_points || '—') + ' SP'"></span>
                                                <span x-show="feat.target_release" class="text-[9px] font-mono text-ink-400" x-text="feat.target_release"></span>
                                            </div>
                                            <h4 class="text-[13px] font-bold text-ink-800 leading-tight" x-text="feat.title"></h4>
                                        </div>
                                        <div class="flex-shrink-0 flex items-center gap-1.5">
                                            <button x-show="!aiSuggestionStatus['feature_'+feat._origIdx] || aiSuggestionStatus['feature_'+feat._origIdx]==='pending'" @click="approveFeatureSuggestion(feat._origIdx,'feature')" class="text-[10px] font-semibold text-white bg-emerald-500 hover:bg-emerald-600 px-2.5 py-1 rounded-md transition-all">Approve</button>
                                            <button x-show="!aiSuggestionStatus['feature_'+feat._origIdx] || aiSuggestionStatus['feature_'+feat._origIdx]==='pending'" @click="declineFeatureSuggestion(feat._origIdx,'feature')" class="text-[10px] font-medium text-ink-400 hover:text-ink-700 px-2 py-1 rounded-md hover:bg-ink-100 transition-all">Decline</button>
                                            <span x-show="aiSuggestionStatus['feature_'+feat._origIdx]==='adding'" class="text-[10px] text-brand-600 font-medium">Adding...</span>
                                            <span x-show="aiSuggestionStatus['feature_'+feat._origIdx]==='approved'" class="text-[10px] text-emerald-600 font-semibold">✓ Added</span>
                                            <span x-show="aiSuggestionStatus['feature_'+feat._origIdx]==='declined'" class="text-[10px] text-ink-400">Declined</span>
                                            <span x-show="aiSuggestionStatus['feature_'+feat._origIdx]==='error'" class="text-[10px] text-rose-500">Failed</span>
                                        </div>
                                    </div>
                                    <!-- Feature body: description + AC + metadata bar -->
                                    <div class="px-4 pb-2.5 space-y-2">
                                        <div>
                                            <div class="text-[9px] text-ink-400 uppercase tracking-wider mb-0.5">Description</div>
                                            <div class="text-[11px] text-ink-600 leading-relaxed prose-p:my-0.5 prose-li:my-0" x-html="renderMarkdown(feat.description || '—')"></div>
                                        </div>
                                        <div>
                                            <div class="text-[9px] text-ink-400 uppercase tracking-wider mb-0.5">Acceptance Criteria</div>
                                            <div class="text-[11px] text-ink-600 leading-relaxed prose-p:my-0.5 prose-li:my-0 prose-ul:my-0.5" x-html="renderMarkdown(feat.acceptance_criteria || '—')"></div>
                                        </div>
                                        <!-- Single-line metadata bar -->
                                        <div class="flex items-center gap-3 text-[10px] text-ink-500 pt-1.5 border-t border-ink-100">
                                            <span><span class="text-ink-400">Actor:</span> <span x-text="feat.primary_actor || '—'"></span></span>
                                            <span><span class="text-ink-400">SP:</span> <span class="font-bold" x-text="feat.story_points || '—'"></span></span>
                                            <span><span class="text-ink-400">Release:</span> <span class="font-mono" x-text="feat.target_release || '—'"></span></span>
                                        </div>
                                        <div x-show="feat.rationale" class="text-[10px] text-ink-400 italic pt-1 border-t border-ink-100">
                                            <span class="font-medium not-italic">Why:</span> <span x-html="renderMarkdown(feat.rationale)"></span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Fill field suggestion -->
            <template x-if="!aiLoading && aiModalContent && !aiModalContent.error && aiModalType === 'fill'">
                <div class="space-y-3">
                    <div class="bg-brand-50/40 border border-brand-100 rounded-xl p-4">
                        <div class="text-[10px] font-semibold text-brand-600 uppercase tracking-wider mb-2">AI Suggestion</div>
                        <div class="text-[13px] text-ink-700 leading-relaxed prose-p:my-1 prose-li:my-0" x-html="renderMarkdown(aiModalContent[_aiFillFieldName] || aiModalContent.description || aiModalContent.acceptance_criteria || '')"></div>
                    </div>
                    <div x-show="aiModalContent.explanation" class="bg-ink-50 rounded-xl p-3">
                        <div class="text-[10px] font-semibold text-ink-400 uppercase tracking-wider mb-1">Why this?</div>
                        <div class="text-[11px] text-ink-500 prose-p:my-0.5" x-html="renderMarkdown(aiModalContent.explanation)"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer: Approve / Decline -->
        <template x-if="!aiLoading && aiModalContent && !aiModalContent.error">
            <div class="sticky bottom-0 bg-white border-t border-black/[0.06] px-6 py-3 flex items-center justify-between gap-3">
                <button @click="declineAISuggestion()" class="text-[12px] font-medium text-ink-500 hover:text-ink-800 px-4 py-2 rounded-xl hover:bg-ink-100 transition-all">
                    Decline
                </button>
                <button @click="approveAISuggestion()" class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-white btn-primary px-5 py-2 rounded-xl transition-all">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    <span x-text="aiModalType === 'features' ? 'Done' : 'Approve & Apply'"></span>
                </button>
            </div>
        </template>
    </div>
</div>

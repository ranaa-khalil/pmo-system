<!-- ==================== CLIENT MODAL ==================== -->
<div x-show="clientModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto" aria-modal="true">
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm backdrop-blur-sm overlay-enter" @click="clientModalOpen = false"></div>
    <div class="flex min-h-full items-center justify-center p-4 relative">
        <div class="surface rounded-3xl shadow-modal w-full max-w-md modal-enter overflow-hidden border border-black/[0.06]">
            <div class="px-6 py-5 border-b border-black/[0.06] flex items-center justify-between">
                <div>
                    <h2 class="text-[17px] font-bold text-ink-900 tracking-tight" x-text="editingClient.id ? 'Edit Client' : 'New Client'"></h2>
                    <p class="text-[12px] text-ink-400 mt-0.5" x-text="editingClient.id ? 'Update client information' : 'Add a new client organization'"></p>
                </div>
                <button @click="clientModalOpen = false" class="p-2 text-ink-400 hover:text-ink-600 hover:bg-ink-100 rounded-xl transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form @submit.prevent="saveClient()" class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Name *</label>
                    <input x-model="editingClient.name" type="text" required
                           class="input-premium w-full text-[14px] px-3 py-2"
                           placeholder="Client name">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Contact Name</label>
                        <input x-model="editingClient.contact_name" type="text"
                               class="input-premium w-full text-[14px] px-3 py-2"
                               placeholder="Aldaana Almuqrin">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Email</label>
                        <input x-model="editingClient.contact_email" type="email"
                               class="input-premium w-full text-[14px] px-3 py-2"
                               placeholder="contact@org.com">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Description</label>
                    <textarea x-model="editingClient.description" rows="3"
                              class="input-premium w-full text-[14px] resize-none"
                              placeholder="Brief description of the client..."></textarea>
                    <p class="text-[9px] text-ink-300 mt-0.5">Supports Markdown formatting</p>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" @click="clientModalOpen = false" class="text-[13px] font-medium text-ink-600 px-4 py-2.5 rounded-xl hover:bg-ink-100 transition-colors">Cancel</button>
                    <button type="submit" class="text-[13px] font-medium text-white bg-brand-600 px-5 py-2.5 rounded-xl shadow-sm hover:shadow-xl hover:shadow-brand-600/25 transition-all">Save Client</button>
                </div>
            </form>
        </div>
    </div>
</div>

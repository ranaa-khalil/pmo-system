<!-- ==================== FLOATING ACTION BUTTON (Quick Add Task) ==================== -->
<div x-data="fabComponent"
@mousemove.window="onDrag($event)"
@mouseup.window="endDrag()"
@touchmove.window="onDrag($event)"
@touchend.window="endDrag()"
class="fixed z-40 select-none"
:style="'left:' + pos.x + 'px; top:' + pos.y + 'px;'"
x-show="isLoggedIn"
x-cloak
x-init="init()">
    <!-- Quick Add Popup -->
    <div x-show="showPopup" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-90"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-90"
         class="absolute bottom-16 right-0 w-72 surface rounded-2xl shadow-modal border border-ink-200/60 p-3"
         @click.away="showPopup = false">
        <div class="text-[11px] font-bold text-ink-400 uppercase tracking-wider mb-2 px-1">Quick Add Task</div>
        <form @submit.prevent="submitQuick()">
            <input x-model="quickTitle" type="text" placeholder="What needs to be done?"
                   class="w-full px-3 py-2 rounded-xl border border-ink-200 text-[13px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all"
                   @keydown.escape="showPopup = false">
            <button type="submit" class="mt-2 w-full px-4 py-2 rounded-xl bg-brand-600 text-white text-[13px] font-semibold hover:shadow-md transition-shadow flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                Add Task
            </button>
        </form>
        <button @click="showPopup = false; $dispatch('open-full-task-modal')"
                class="w-full mt-2 text-[11px] font-medium text-brand-600 hover:text-brand-700 px-2 py-1.5 rounded-lg hover:bg-brand-50 transition-colors text-left">
            More options →
        </button>
    </div>

    <!-- FAB Button -->
    <button @mousedown="startDrag($event)"
            @touchstart="startDrag($event)"
            class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg shadow-brand-500/30 flex items-center justify-center hover:shadow-xl hover:shadow-brand-500/40 hover:scale-105 transition-all cursor-grab active:cursor-grabbing"
            :class="dragging ? 'scale-110 shadow-xl' : ''"
            title="Quick Add Task (drag to move)">
        <svg class="w-6 h-6 transition-transform" :class="showPopup ? 'rotate-45' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>
</div>

<!-- ============ PORTAL LOGIN PANEL (client contacts) ============
     Opens from the "Client portal" link on the login screen. -->
<div x-show="showPortalLogin && !portalMode && !isLoggedIn" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center bg-ink-900/30 backdrop-blur-sm px-4">
    <div class="surface rounded-3xl shadow-modal p-8 w-full max-w-[380px] modal-enter border border-black/[0.06] bg-white">
        <div class="flex items-center justify-between mb-1">
            <h2 class="text-[20px] font-bold text-ink-900 tracking-tight">Client Portal</h2>
            <button @click="showPortalLogin = false" class="p-2 text-ink-400 hover:text-ink-700 hover:bg-ink-100 rounded-lg transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <p class="text-[13px] text-ink-500 mb-6">Track your project progress in real time.</p>

        <form @submit.prevent="portalLogin()" class="space-y-4">
            <div>
                <label class="block text-[12px] font-medium text-ink-700 mb-1.5">Work email</label>
                <input x-model="portalLoginForm.email" type="email" required
                       class="input-premium w-full text-[14px] rounded-xl px-4 py-3 placeholder-ink-300 transition-all"
                       placeholder="you@client.com">
            </div>
            <div>
                <label class="block text-[12px] font-medium text-ink-700 mb-1.5">Passcode</label>
                <input x-model="portalLoginForm.passcode" type="password" required
                       class="input-premium w-full text-[14px] rounded-xl px-4 py-3 placeholder-ink-300 transition-all"
                       placeholder="Provided by your account manager">
            </div>
            <template x-if="portalLoginError">
                <div class="text-[12px] text-rose-600 bg-rose-50 border border-rose-100 px-3 py-2.5 rounded-xl" x-text="portalLoginError"></div>
            </template>
            <button type="submit" :disabled="portalLoginBusy"
                    class="btn-primary w-full text-[14px] font-medium text-white px-4 py-3 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-text="portalLoginBusy ? 'Signing in...' : 'View My Projects'"></span>
            </button>
        </form>
        <p class="mt-4 text-center text-[11px] text-ink-300">Passcodes are issued by your Obelion account manager.</p>
    </div>
</div>

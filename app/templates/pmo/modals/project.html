<!-- ==================== PROJECT MODAL ==================== -->
<div x-show="projectModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto" aria-modal="true">
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm backdrop-blur-sm overlay-enter" @click="projectModalOpen = false"></div>
    <div class="flex min-h-full items-center justify-center p-4 relative">
        <div class="surface rounded-3xl shadow-modal w-full max-w-md modal-enter overflow-hidden border border-black/[0.06]">
            <div class="px-6 py-5 border-b border-black/[0.06] flex items-center justify-between">
                <div>
                    <h2 class="text-[17px] font-bold text-ink-900 tracking-tight" x-text="editingProject.id ? 'Edit Project' : 'New Project'"></h2>
                    <p class="text-[12px] text-ink-400 mt-0.5" x-text="editingProject.id ? 'Update project information' : 'Create a new project for a client'"></p>
                </div>
                <button @click="projectModalOpen = false" class="p-2 text-ink-400 hover:text-ink-600 hover:bg-ink-100 rounded-xl transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form @submit.prevent="saveProject()" class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Name *</label>
                    <input x-model="editingProject.name" type="text" required
                           class="input-premium w-full text-[14px] px-3 py-2"
                           placeholder="Project name">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Client *</label>
                    <select x-model="editingProject.client_id" required
                            class="input-premium w-full text-[14px] bg-white">
                        <option value="">Select a client...</option>
                        <template x-for="c in clients" :key="c.id">
                            <option :value="c.id" x-text="c.name"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Status</label>
                        <select x-model="editingProject.status"
                                class="input-premium w-full text-[14px] bg-white">
                            <option value="Active">Active</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">GitHub Repo</label>
                        <input x-model="editingProject.github_repo" type="text"
                               class="input-premium w-full text-[14px] font-mono text-[13px]"
                               placeholder="org/repo">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Starting Version (SemVer prefix)</label>
                    <input x-model="editingProject.version_prefix" type="text"
                           class="input-premium w-full text-[14px] font-mono text-[13px]"
                           placeholder="Version">
                    <p class="text-[10px] text-ink-400 mt-1">Set the base version. Releases auto-increment: 1.0.0 → 1.1.0 → 1.2.0 (minor), 1.0.1 (patch), 2.0.0 (major).</p>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Description</label>
                    <textarea x-model="editingProject.description" rows="3"
                              class="input-premium w-full text-[14px] resize-none"
                              placeholder="Brief description..."></textarea>
                    <p class="text-[9px] text-ink-300 mt-0.5">Supports Markdown formatting</p>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Dev URL</label>
                        <input x-model="editingProject.dev_url" type="url"
                               class="input-premium w-full text-[13px] px-3 py-2"
                               placeholder="https://dev...">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">UAT URL</label>
                        <input x-model="editingProject.uat_url" type="url"
                               class="input-premium w-full text-[13px] px-3 py-2"
                               placeholder="https://uat...">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-ink-500 uppercase tracking-wider mb-1.5">Prod URL</label>
                        <input x-model="editingProject.prod_url" type="url"
                               class="input-premium w-full text-[13px] px-3 py-2"
                               placeholder="https://prod...">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" @click="projectModalOpen = false" class="text-[13px] font-medium text-ink-600 px-4 py-2.5 rounded-xl hover:bg-ink-100 transition-colors">Cancel</button>
                    <button type="submit" class="text-[13px] font-medium text-white bg-brand-600 px-5 py-2.5 rounded-xl shadow-sm hover:shadow-xl hover:shadow-brand-600/25 transition-all">Save Project</button>
                </div>
            </form>
        </div>
    </div>
</div>

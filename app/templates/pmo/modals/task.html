<!-- ==================== TASK MODAL ==================== -->
<div x-show="showTaskModal" x-cloak class="fixed inset-0 z-50 overflow-y-auto" aria-modal="true">
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm overlay-enter" @click.self="closeTaskModal()"></div>
    <div class="flex min-h-full items-center justify-center p-4 relative">
        <div class="surface rounded-3xl shadow-modal w-full max-w-lg modal-enter overflow-hidden border border-black/[0.06]">
            <div class="px-6 py-5 border-b border-black/[0.06] flex items-center justify-between">
                <div>
                    <h2 class="text-[17px] font-bold text-ink-900 tracking-tight" x-text="editingTask ? 'Edit Task' : 'New Task'"></h2>
                    <p class="text-[12px] text-ink-400 mt-0.5" x-text="editingTask ? 'Update task details' : 'Create a personal to-do'"></p>
                </div>
                <button @click="closeTaskModal()" class="p-2 text-ink-400 hover:text-ink-600 hover:bg-ink-100 rounded-xl transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form @submit.prevent="saveTask()" class="px-6 py-5 space-y-4">
                <!-- Title -->
                <div>
                    <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Title</label>
                    <input x-model="taskForm.title" type="text" required placeholder="What needs to be done?"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all">
                </div>
                <!-- Description -->
                <div>
                    <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Description <span class="text-ink-400 font-normal">(optional)</span></label>
                    <textarea x-model="taskForm.description" rows="2" placeholder="Add details..."
                              class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all resize-none"></textarea>
                    <p class="text-[9px] text-ink-300 mt-0.5">Supports Markdown formatting</p>
                </div>
                <!-- Project + Milestone -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Project <span class="text-ink-400 font-normal">(optional)</span></label>
                        <select x-model="taskForm.project_id" class="input-premium w-full px-3.5 py-2.5 rounded-[10px] text-[14px] bg-white">
                            <option :value="null">— General (no project) —</option>
                            <template x-for="p in projects" :key="p.id">
                                <option :value="p.id" x-text="p.name"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Milestone <span class="text-ink-400 font-normal">(optional)</span></label>
                        <select x-model="taskForm.milestone_id" class="input-premium w-full px-3.5 py-2.5 rounded-[10px] text-[14px] bg-white" :disabled="!taskForm.project_id">
                            <option :value="null">— None —</option>
                            <template x-for="m in milestoneOptions" :key="m.id">
                                <option :value="m.id" x-text="m.title"></option>
                            </template>
                        </select>
                    </div>
                </div>
                <!-- Due date + Priority -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Due Date</label>
                        <input x-model="taskForm.due_date" type="date"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Priority</label>
                        <select x-model="taskForm.priority" class="input-premium w-full px-3.5 py-2.5 rounded-[10px] text-[14px] bg-white">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                </div>
                <!-- Reminder + Status -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Remind me (days before)</label>
                        <input x-model.number="taskForm.reminder_days" type="number" min="1" max="30"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all">
                    </div>
                    <div x-show="editingTask">
                        <label class="block text-[12px] font-medium text-ink-600 mb-1.5">Status</label>
                        <select x-model="taskForm.status" class="input-premium w-full px-3.5 py-2.5 rounded-[10px] text-[14px] bg-white">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                <!-- Actions -->
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" @click="closeTaskModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-medium text-ink-600 hover:bg-ink-100 transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white text-[13px] font-semibold hover:bg-brand-700 transition-colors shadow-sm">
                        <span x-text="editingTask ? 'Save Changes' : 'Create Task'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

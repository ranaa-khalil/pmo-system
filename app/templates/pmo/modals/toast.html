<!-- ==================== TOAST ==================== -->
<div x-show="toast.show" x-cloak x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 translate-y-2" class="fixed bottom-6 right-6 z-[60]">
    <div class="flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-lift border border-white/10"
         :class="toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'">
        <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center">
            <svg x-show="toast.type !== 'error'" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            <svg x-show="toast.type === 'error'" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </div>
        <span class="text-[13px] font-medium text-white" x-text="toast.message"></span>
    </div>
</div>

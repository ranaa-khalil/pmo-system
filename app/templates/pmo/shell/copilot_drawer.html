<!-- ==================== PMO COPILOT DRAWER ==================== -->
<!-- ONE Ask surface (Rethink MVP #4): a single conversation thread — chat,
     proposal cards, kickoff intake and guided interviews as message types in
     one thread. No mode tabs: capabilities stay reachable via the in-panel
     fallback list below. Reads show server-validated, CLICKABLE references;
     writes require Confirm. -->
<!-- QA F7: plain x-show on the outer (no x-transition on the same element —
     when transitionend never fires the leave sequence sticks at leave-start
     and the drawer stays visually open). Pattern: components/item_drawer.html. -->
<div x-show="copilotOpen" x-cloak
     class="fixed bottom-6 right-6 w-[400px] h-[600px] max-h-[calc(100vh-3rem)] z-50 surface rounded-2xl shadow-modal border border-ink-200/60 flex flex-col overflow-hidden"
     @keydown.escape.window="copilotOpen = false">
    <!-- Header (no mode tabs — ONE Ask surface) -->
    <div class="px-4 py-3 border-b border-ink-100 flex items-center justify-between bg-gradient-to-r from-brand-600 to-violet-600">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-white/15 flex items-center justify-center">
                <svg class="w-4.5 h-4.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <div>
                <div class="text-[13px] font-bold text-white leading-tight">PMO Copilot</div>
                <div class="text-[10px] text-white/75 leading-tight flex items-center gap-1">
                    <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                    </svg>
                    <span x-text="selectedProject ? selectedProject.name : 'All projects'"></span>
                </div>
            </div>
        </div>
        <button @click="copilotOpen = false" class="p-1.5 rounded-lg hover:bg-white/10 transition-colors">
            <svg class="w-4 h-4 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- ═══ ONE ASK SURFACE: the single conversation thread ═══ -->
    <div id="copilot-messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
        <!-- Messages -->
        <template x-for="(msg, idx) in copilotMessages" :key="idx">
            <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-[12.5px] leading-relaxed"
                     :class="msg.role === 'user'
                         ? 'bg-brand-600 text-white rounded-br-md'
                         : (msg.error ? 'bg-rose-50 text-rose-700 border border-rose-200 rounded-bl-md' : 'bg-ink-100/80 text-ink-700 rounded-bl-md')">
                    <!-- Structured answer: markdown rendered (bold, bullets, line breaks) -->
                    <template x-if="msg.role === 'user'">
                        <span x-text="msg.text"></span>
                    </template>
                    <template x-if="msg.role !== 'user'">
                        <div class="md-content" x-html="renderChatMarkdown(msg.text)"></div>
                    </template>
                    <!-- Tool round status (phase 3): the tool the escalation loop ran -->
                    <template x-if="msg.role !== 'user' && msg.toolStatus">
                        <div class="mt-1 flex items-center gap-1 text-[10px] text-ink-400">
                            <svg class="w-2.5 h-2.5 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <circle cx="12" cy="12" r="9" stroke-dasharray="40" stroke-dashoffset="18"/>
                            </svg>
                            <span x-text="msg.toolStatus"></span>
                        </div>
                    </template>

                    <!-- Clickable references (Rethink MVP #2): server-validated
                         citations rendered as deep-link chips — a tap lands at
                         the record (openReference). Falls back to plain chips
                         when a message predates the references contract. -->
                    <template x-if="msg.role !== 'user' && msg.references && msg.references.length > 0">
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <template x-for="(ref, ri) in msg.references" :key="'ref-' + idx + '-' + ri">
                                <button @click="openReference(ref)" :disabled="!ref.url"
                                        title="Open this record"
                                        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white border border-brand-200 text-[10px] font-semibold text-brand-700 hover:bg-brand-50 hover:border-brand-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <span x-text="ref.label"></span>
                                    <span class="text-brand-400" x-show="ref.url">→</span>
                                </button>
                            </template>
                        </div>
                    </template>
                    <template x-if="msg.role !== 'user' && !(msg.references && msg.references.length > 0) && msg.sources && msg.sources.length > 0">
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <template x-for="(src, si) in msg.sources" :key="'src-' + idx + '-' + si">
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white border border-ink-200 text-[10px] font-medium text-ink-500"
                                      x-text="src"></span>
                            </template>
                        </div>
                    </template>

                    <!-- Proposal operations (draft → confirm): op card per operation -->
                    <template x-if="msg.ops && msg.ops.length > 0">
                        <div class="mt-2.5 space-y-1.5">
                            <template x-for="(op, oi) in msg.ops" :key="'op-' + idx + '-' + oi">
                                <div class="rounded-xl border border-violet-200 bg-violet-50/50 px-3 py-2">
                                    <div class="flex items-center gap-2">
                                        <span class="px-1.5 py-0.5 rounded-md bg-violet-600 text-white font-bold uppercase tracking-wide text-[8.5px]"
                                              x-text="op.op === 'advance_item' ? 'Advance' : op.op === 'assign_user' ? 'Assign' : op.op === 'create_risk_draft' ? 'Risk draft' : 'Escalate'"></span>
                                        <span class="text-[11.5px] font-semibold text-ink-800"
                                              x-text="op.title || op.description || ('Item ' + (op.item_id || op.approval_id || op.project_id))"></span>
                                    </div>
                                    <div class="mt-1 text-[10.5px] text-ink-500 flex items-center gap-1.5">
                                        <template x-if="op.target_phase"><span x-text="'→ ' + op.target_phase"></span></template>
                                        <template x-if="op.assignee_id"><span x-text="'→ user #' + op.assignee_id"></span></template>
                                        <template x-if="op.note"><span x-text="op.note"></span></template>
                                        <template x-if="!op.target_phase && !op.assignee_id && !op.note"><span x-text="'record #' + (op.item_id || op.approval_id || op.project_id)"></span></template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Kickoff paste card (in-panel capability: conversational initiation) ── -->
        <template x-if="intakeKickoffOpen && !intakeDraft && !intakeResult">
            <div class="space-y-3">
                <div class="bg-ink-100/80 rounded-2xl rounded-bl-md px-3.5 py-2.5 text-[12.5px] text-ink-700 leading-relaxed">
                    Paste your kickoff notes — a paragraph, meeting notes, or a doc. I'll structure them into epics, features, personas, and KPIs. You review, edit, and Apply — nothing is created until you confirm. No project open? Applying creates the project first, then fills it.
                </div>
                <textarea x-model="intakeKickoff" rows="4"
                          placeholder="We are building a cloud platform for PNU to manage student services. Students log in with SSO and browse available courses. Faculty members approve registrations and publish grades…"
                          class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[12.5px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all bg-white resize-none"></textarea>
                <div class="flex items-center gap-2">
                    <button @click="intakeKickoffOpen = false" class="px-3 py-2 rounded-xl text-[12px] font-semibold text-ink-500 hover:bg-ink-100 transition-colors">Close</button>
                    <button @click="intakeStructure()" :disabled="intakeBusy || !intakeKickoff.trim()"
                            class="flex-1 px-4 py-2.5 rounded-xl bg-brand-600 text-white text-[12.5px] font-semibold hover:shadow-md transition-shadow disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" :class="intakeBusy ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path x-show="!intakeBusy" stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            <circle x-show="intakeBusy" cx="12" cy="12" r="9" stroke-dasharray="40" stroke-dashoffset="18"/>
                        </svg>
                        <span x-text="intakeBusy ? 'Structuring…' : 'Structure kickoff'"></span>
                    </button>
                </div>
            </div>
        </template>

        <!-- ── Structured intake draft (review before Apply — the only write) ── -->
        <template x-if="intakeDraft && !intakeResult">
            <div class="space-y-3">
                <div class="surface rounded-xl border border-ink-200/60 p-3.5">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 rounded-full bg-violet-100 text-violet-700 text-[9px] font-bold uppercase tracking-wider">Draft</span>
                        <span class="text-[10px] text-ink-400">review before Apply</span>
                    </div>
                    <p class="text-[12.5px] font-semibold text-ink-800" x-text="intakeDraft.summary"></p>
                    <!-- Epics & features -->
                    <div class="mt-3 space-y-2.5" x-show="intakeDraft.epics && intakeDraft.epics.length">
                        <template x-for="(epic, ei) in intakeDraft.epics" :key="'epic-' + ei">
                            <div class="border-l-2 border-brand-300 pl-2.5">
                                <div class="text-[11.5px] font-bold text-ink-700" x-text="epic.name"></div>
                                <ul class="mt-1 space-y-0.5">
                                    <template x-for="(feat, fi) in epic.features" :key="'feat-' + ei + '-' + fi">
                                        <li class="text-[11.5px] text-ink-500 flex items-start gap-1.5">
                                            <span class="text-brand-400 mt-0.5">•</span>
                                            <span><span class="text-ink-700 font-medium" x-text="feat.title"></span> — <span x-text="feat.description"></span></span>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </div>
                    <!-- Personas -->
                    <div class="mt-3" x-show="intakeDraft.personas && intakeDraft.personas.length">
                        <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">Personas</div>
                        <div class="flex flex-wrap gap-1.5">
                            <template x-for="(p, pi) in intakeDraft.personas" :key="'persona-' + pi">
                                <span class="px-2 py-0.5 rounded-full bg-ink-100 border border-ink-200 text-[10.5px] font-medium text-ink-600" x-text="p.name"></span>
                            </template>
                        </div>
                    </div>
                    <!-- KPIs -->
                    <div class="mt-3" x-show="intakeDraft.kpis && intakeDraft.kpis.length">
                        <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">KPIs</div>
                        <div class="space-y-0.5">
                            <template x-for="(k, ki) in intakeDraft.kpis" :key="'kpi-' + ki">
                                <div class="text-[11.5px] text-ink-600"><span class="font-medium text-ink-700" x-text="k.name"></span> — target <span x-text="k.target"></span></div>
                            </template>
                        </div>
                    </div>
                    <!-- Assumptions -->
                    <div class="mt-3 bg-amber-50/70 border border-amber-100 rounded-lg p-2.5" x-show="intakeDraft.assumptions && intakeDraft.assumptions.length">
                        <div class="text-[10px] font-bold text-amber-600 uppercase tracking-wider mb-1">Assumptions</div>
                        <template x-for="(a, ai) in intakeDraft.assumptions" :key="'assumption-' + ai">
                            <div class="text-[11px] text-amber-700" x-text="'· ' + a"></div>
                        </template>
                    </div>
                </div>
                <!-- Apply bar (the only write) -->
                <div class="flex items-center gap-2">
                    <button @click="intakeDraft = null"
                            class="flex-1 px-3 py-2 rounded-xl text-[12px] font-semibold text-ink-500 hover:bg-ink-100 transition-colors">Discard</button>
                    <button @click="intakeApply()" :disabled="intakeApplying"
                            class="flex-1 px-3 py-2 rounded-xl bg-emerald-600 text-white text-[12px] font-semibold hover:bg-emerald-700 transition-colors disabled:opacity-50 flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        <span x-text="intakeApplying ? 'Applying…' : 'Apply intake'"></span>
                    </button>
                </div>
            </div>
        </template>

        <!-- ── Intake applied result ── -->
        <template x-if="intakeResult">
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    <span class="text-[13px] font-bold text-emerald-800">Intake applied</span>
                </div>
                <div class="text-[12px] text-emerald-700 space-y-0.5">
                    <div x-text="`${intakeResult.features_created} features created${intakeResult.features_skipped ? ' · ' + intakeResult.features_skipped + ' duplicates skipped' : ''}`"></div>
                    <div x-text="`${intakeResult.personas_created} personas · ${intakeResult.kpis_created} KPIs`"></div>
                </div>
                <!-- Clickable outcome tags: land in the project at the right tab -->
                <div class="flex flex-wrap gap-1.5 pt-1" x-show="intakeResult.features_created > 0 || intakeResult.personas_created > 0 || intakeResult.kpis_created > 0">
                    <template x-if="intakeResult.features_created > 0">
                        <button @click="openOutcomeRecord('feature')"
                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-violet-100 border border-violet-200 text-[10px] font-semibold text-violet-700 hover:bg-violet-200 transition-colors">
                            <span x-text="`${intakeResult.features_created} Feature${intakeResult.features_created === 1 ? '' : 's'}`"></span>
                            <span class="text-violet-400">→</span>
                        </button>
                    </template>
                    <template x-if="intakeResult.personas_created > 0">
                        <button @click="openOutcomeRecord('persona')"
                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-indigo-100 border border-indigo-200 text-[10px] font-semibold text-indigo-700 hover:bg-indigo-200 transition-colors">
                            <span x-text="`${intakeResult.personas_created} Persona${intakeResult.personas_created === 1 ? '' : 's'}`"></span>
                            <span class="text-indigo-400">→</span>
                        </button>
                    </template>
                    <template x-if="intakeResult.kpis_created > 0">
                        <button @click="openOutcomeRecord('kpi')"
                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-indigo-100 border border-indigo-200 text-[10px] font-semibold text-indigo-700 hover:bg-indigo-200 transition-colors">
                            <span x-text="`${intakeResult.kpis_created} KPI${intakeResult.kpis_created === 1 ? '' : 's'}`"></span>
                            <span class="text-indigo-400">→</span>
                        </button>
                    </template>
                    <template x-if="intakeResult.project_name">
                        <button @click="openOutcomeRecord('feature')"
                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white border border-emerald-200 text-[10px] font-semibold text-emerald-700 hover:bg-emerald-100 transition-colors">
                            <span x-text="intakeResult.project_name"></span>
                            <span class="text-emerald-400">→</span>
                        </button>
                    </template>
                    <template x-if="intakeResult.features_skipped > 0">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full bg-white border border-ink-200 text-[10px] font-medium text-ink-400"
                              x-text="`${intakeResult.features_skipped} duplicate${intakeResult.features_skipped === 1 ? '' : 's'} skipped`"></span>
                    </template>
                </div>
                <div class="text-[10.5px] text-emerald-600">Every record carries its intake source. Click a tag to review.</div>
                <button @click="intakeKickoff = ''; intakeDraft = null; intakeResult = null; intakeKickoffOpen = false"
                        class="text-[11px] font-semibold text-emerald-700 hover:text-emerald-800 underline">Structure another kickoff</button>
            </div>
        </template>

        <!-- ── Guided interview (active session) — message-type card in the thread ── -->
        <template x-if="interviewSession && !interviewSession.done">
            <div class="space-y-3">
                <!-- Progress -->
                <div class="flex items-center gap-2">
                    <div class="flex-1 h-1.5 rounded-full bg-ink-100 overflow-hidden">
                        <div class="h-full rounded-full bg-gradient-to-r from-brand-500 to-violet-500 transition-all duration-300"
                             :style="'width:' + Math.round((interviewSession.progress.current / interviewSession.progress.total) * 100) + '%'"></div>
                    </div>
                    <span class="text-[10px] font-semibold text-ink-400" x-text="interviewSession.progress.current + ' of ' + interviewSession.progress.total"></span>
                    <button @click="interviewBack()" :disabled="interviewBusy"
                            class="text-[10.5px] font-semibold text-brand-600 hover:text-brand-700 transition-colors disabled:opacity-40 whitespace-nowrap">← Back</button>
                </div>
                <!-- Quick-pick chips for the current question -->
                <div class="flex flex-wrap gap-1.5" x-show="interviewSession.question.choices && interviewSession.question.choices.length">
                    <template x-for="c in (interviewSession.question.choices || [])" :key="c">
                        <button @click="interviewAnswer(c)"
                                class="px-3 py-1.5 rounded-full bg-white border border-brand-200 text-[11.5px] font-medium text-brand-700 hover:bg-brand-50 hover:border-brand-300 transition-all"
                                x-text="c"></button>
                    </template>
                </div>
                <!-- Answers so far (the draft grows live) -->
                <div x-show="Object.keys(interviewSession.answers_so_far || {}).length > 0" class="rounded-xl border border-ink-200/60 bg-white px-3.5 py-3">
                    <div class="text-[9px] font-bold uppercase tracking-wider text-ink-400 mb-1.5">Your answers so far</div>
                    <div class="space-y-1">
                        <template x-for="(val, key) in (interviewSession.answers_so_far || {})" :key="key">
                            <div class="text-[11px] text-ink-600 flex gap-1.5">
                                <span class="font-medium text-ink-700 capitalize shrink-0" x-text="(key.replaceAll('_', ' ') + ':')"></span>
                                <span class="truncate" x-text="val || '—'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- ── Guided interview: draft review (Apply is the only write) ── -->
        <template x-if="interviewDraft && interviewFinished">
            <div class="space-y-3">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    <span class="text-[12.5px] font-bold text-ink-800">Draft ready — review before applying</span>
                </div>
                <div class="rounded-xl border border-ink-200/60 bg-white p-3.5 space-y-3" x-show="interviewFlow === 'project'">
                    <div>
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-400 mb-1">Summary</div>
                        <textarea x-model="interviewDraft.summary" rows="2" class="w-full text-[12px] text-ink-700 bg-ink-50/50 border border-ink-200/60 rounded-lg px-2.5 py-2 focus:ring-1 focus:ring-brand-400 outline-none"></textarea>
                    </div>
                    <div>
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-400 mb-1">Epics & features</div>
                        <div class="space-y-2">
                            <template x-for="(epic, ei) in (interviewDraft.epics || [])" :key="'epic-' + ei">
                                <div class="border-l-2 border-brand-300 pl-2.5">
                                    <div class="text-[12px] font-semibold text-ink-800" x-text="epic.name"></div>
                                    <div class="ml-1 space-y-0.5 mt-0.5">
                                        <template x-for="(f, fi) in (epic.features || [])" :key="'epic-' + ei + '-f-' + fi">
                                            <div class="text-[11px] text-ink-500 flex items-center gap-1.5">
                                                <span class="w-1 h-1 rounded-full bg-brand-400 shrink-0"></span>
                                                <input x-model="f.title" class="flex-1 bg-transparent border-0 border-b border-transparent hover:border-ink-200 focus:border-brand-400 outline-none text-[11px] text-ink-600 p-0">
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <div x-show="!(interviewDraft.epics || []).length" class="text-[11px] text-ink-400">No epics detected — apply will create none; add features manually afterwards.</div>
                        </div>
                    </div>
                    <div x-show="interviewDraft.personas && interviewDraft.personas.length">
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-400 mb-1">Personas</div>
                        <div class="flex flex-wrap gap-1.5">
                            <template x-for="(p, pi) in (interviewDraft.personas || [])" :key="'persona-' + pi">
                                <span class="px-2 py-0.5 rounded-full bg-ink-100 border border-ink-200 text-[10.5px] font-medium text-ink-600" x-text="p.name"></span>
                            </template>
                        </div>
                    </div>
                    <div x-show="interviewDraft.kpis && interviewDraft.kpis.length">
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-400 mb-1">KPIs</div>
                        <div class="space-y-0.5">
                            <template x-for="(k, ki) in (interviewDraft.kpis || [])" :key="'kpi-' + ki">
                                <div class="text-[11.5px] text-ink-600"><span class="font-medium text-ink-700" x-text="k.name"></span> — target <span x-text="k.target"></span></div>
                            </template>
                        </div>
                    </div>
                </div>
                <!-- Feature draft: these answers pre-fill the backlog form -->
                <div class="rounded-xl border border-ink-200/60 bg-white p-3.5 space-y-2" x-show="interviewFlow === 'feature'">
                    <div class="rounded-lg bg-brand-50/70 border border-brand-100 px-3 py-2 text-[11.5px] text-brand-700 leading-relaxed">
                        Applying opens the <span class="font-semibold">backlog form with these answers pre-filled</span> — review the fields (add a title), then save like any manual entry. Nothing is created until you save the form.
                    </div>
                    <template x-for="(val, key) in (interviewDraft || {})" :key="'feat-' + key">
                        <div class="text-[11.5px] text-ink-600 flex gap-1.5">
                            <span class="font-medium text-ink-700 capitalize shrink-0" x-text="(key.replaceAll('_', ' ') + ':')"></span>
                            <span class="min-w-0" x-text="val"></span>
                        </div>
                    </template>
                </div>
                <!-- Non-project drafts (risk / release / escalation) -->
                <div class="rounded-xl border border-ink-200/60 bg-white p-3.5 space-y-1" x-show="interviewFlow === 'risk' || interviewFlow === 'release' || interviewFlow === 'escalation'">
                    <template x-for="(val, key) in (interviewDraft || {})" :key="'draft-' + key">
                        <div class="text-[11.5px] text-ink-600 flex gap-1.5">
                            <span class="font-medium text-ink-700 capitalize shrink-0" x-text="(key.replaceAll('_', ' ') + ':')"></span>
                            <span class="min-w-0" x-text="val"></span>
                        </div>
                    </template>
                    <!-- Escalation: pick the approval to escalate -->
                    <div x-show="interviewFlow === 'escalation'" class="pt-2">
                        <div class="text-[9px] font-bold uppercase tracking-wider text-ink-400 mb-1.5">Escalate which approval?</div>
                        <select x-model="interviewEscalationApprovalId"
                                class="w-full text-[12px] rounded-lg border border-ink-200 px-2.5 py-2 bg-white focus:ring-1 focus:ring-brand-400 outline-none">
                            <option value="">— choose an approval —</option>
                            <template x-for="a in (interviewApprovals || [])" :key="a.id">
                                <option :value="a.id" x-text="'#' + a.id + ' — ' + (a.title || a.request_type || 'Approval')"></option>
                            </template>
                        </select>
                        <div x-show="!(interviewApprovals || []).length" class="text-[10.5px] text-ink-400 mt-1">No open approvals in this project — Apply needs one.</div>
                    </div>
                </div>
                <!-- Feature flow needs an open project -->
                <div x-show="interviewFlow === 'feature' && !selectedProject" class="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-[11.5px] text-amber-700">
                    Open a project first — feature intake pre-fills that project's backlog form.
                </div>
                <!-- Apply bar -->
                <div class="flex items-center gap-2">
                    <button @click="interviewSession = null; interviewDraft = null; interviewFinished = false"
                            class="flex-1 px-3 py-2 rounded-xl text-[12px] font-semibold text-ink-500 hover:bg-ink-100 transition-colors">Discard</button>
                    <button @click="interviewApply()" x-show="interviewFlow === 'project' || interviewFlow === 'feature' || interviewFlow === 'risk' || interviewFlow === 'release' || interviewFlow === 'escalation'" :disabled="interviewApplying || (interviewFlow === 'escalation' && !interviewEscalationApprovalId)"
                            class="flex-1 px-3 py-2 rounded-xl bg-emerald-600 text-white text-[12px] font-semibold hover:bg-emerald-700 transition-colors disabled:opacity-50 flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        <span x-text="interviewApplying ? 'Applying…' : 'Apply draft'"></span>
                    </button>
                </div>
            </div>
        </template>

        <!-- ── Guided interview: applied result ── -->
        <template x-if="interviewResult">
            <div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        <span class="text-[13px] font-bold text-emerald-800">Draft applied</span>
                    </div>
                    <div class="text-[12px] text-emerald-700 space-y-0.5">
                        <template x-if="interviewResult.applied">
                            <div x-text="interviewResult.label"></div>
                        </template>
                        <template x-if="!interviewResult.applied">
                            <div>
                                <div x-text="`${interviewResult.features_created} features created${interviewResult.features_skipped ? ' · ' + interviewResult.features_skipped + ' duplicates skipped' : ''}`"></div>
                                <div x-text="`${interviewResult.personas_created} personas · ${interviewResult.kpis_created} KPIs`"></div>
                            </div>
                        </template>
                    </div>
                    <div class="text-[10.5px] text-emerald-600" x-text="interviewResult.applied ? 'Record created with its interview source. Click a tag to review.' : 'Every record carries its interview source. Click a tag to review.'"></div>
                    <!-- Clickable outcome tags: land in the project at the right tab -->
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        <template x-if="interviewResult.applied && interviewResult.project_id">
                            <button @click="openOutcomeRecord(interviewResult.applied)"
                                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-violet-100 border border-violet-200 text-[10px] font-semibold text-violet-700 hover:bg-violet-200 transition-colors">
                                <span x-text="interviewResult.applied === 'risk' ? 'Risk' : interviewResult.applied === 'release' ? 'Release' : 'Approval'"></span>
                                <span class="text-violet-400">→</span>
                            </button>
                        </template>
                        <template x-if="!interviewResult.applied && interviewResult.features_created > 0">
                            <button @click="openOutcomeRecord('feature')"
                                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-violet-100 border border-violet-200 text-[10px] font-semibold text-violet-700 hover:bg-violet-200 transition-colors">
                                <span x-text="`${interviewResult.features_created} Feature${interviewResult.features_created === 1 ? '' : 's'}`"></span>
                                <span class="text-violet-400">→</span>
                            </button>
                        </template>
                        <template x-if="!interviewResult.applied && interviewResult.personas_created > 0">
                            <button @click="openOutcomeRecord('persona')"
                                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-indigo-100 border border-indigo-200 text-[10px] font-semibold text-indigo-700 hover:bg-indigo-200 transition-colors">
                                <span x-text="`${interviewResult.personas_created} Persona${interviewResult.personas_created === 1 ? '' : 's'}`"></span>
                                <span class="text-indigo-400">→</span>
                            </button>
                        </template>
                        <template x-if="!interviewResult.applied && interviewResult.kpis_created > 0">
                            <button @click="openOutcomeRecord('kpi')"
                                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-indigo-100 border border-indigo-200 text-[10px] font-semibold text-indigo-700 hover:bg-indigo-200 transition-colors">
                                <span x-text="`${interviewResult.kpis_created} KPI${interviewResult.kpis_created === 1 ? '' : 's'}`"></span>
                                <span class="text-indigo-400">→</span>
                            </button>
                        </template>
                    </div>
                    <button @click="interviewSession = null; interviewDraft = null; interviewFinished = false; interviewResult = null"
                            class="text-[11px] font-semibold text-emerald-700 hover:text-emerald-800 underline">Start another interview</button>
                </div>
            </div>
        </template>

        <!-- Typing indicator (hidden while tokens stream into the live bubble) -->
        <template x-if="copilotBusy && !copilotStreaming">
            <div class="flex justify-start">
                <div class="bg-ink-100/80 rounded-2xl rounded-bl-md px-4 py-3 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-bounce"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-bounce" style="animation-delay: 0.15s"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-bounce" style="animation-delay: 0.3s"></span>
                </div>
            </div>
        </template>
    </div><!-- /thread -->

    <!-- Confirm / Reject bar (write proposals) -->
    <template x-if="copilotPendingProposal">
        <div class="px-4 py-2.5 border-t border-amber-200 bg-amber-50/80 flex items-center gap-2">
            <div class="flex-1 text-[11px] font-medium text-amber-700">
                Confirm to execute — nothing has been written yet.
            </div>
            <button @click="copilotReject()"
                    class="px-3 py-1.5 rounded-lg text-[11px] font-semibold text-ink-500 hover:bg-ink-100 transition-colors">
                Discard
            </button>
            <button @click="copilotConfirm()"
                    class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-[11px] font-semibold hover:bg-emerald-700 transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
                Confirm
            </button>
        </div>
    </template>

    <!-- Capability fallback (Rethink MVP #4): kickoff + guided capabilities stay
         reachable in-panel — no mode tabs. Hidden while a session/draft is open. -->
    <div class="px-4 pb-2 flex flex-wrap gap-1.5" x-show="showCopilotCapabilities">
        <button @click="openCopilotIntake()"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Paste kickoff notes</button>
        <button @click="interviewStart('project')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Project kickoff</button>
        <button @click="interviewStart('feature')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Feature intake</button>
        <button @click="interviewStart('risk')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Risk entry</button>
        <button @click="interviewStart('release')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Release planning</button>
        <button @click="interviewStart('escalation')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Escalation</button>
    </div>

    <!-- Suggested prompts -->
    <div class="px-4 pb-2 flex flex-wrap gap-1.5" x-show="copilotMessages.length <= 2">
        <button @click="copilotAsk('What is overdue for me?')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">What's overdue?</button>
        <button @click="copilotAsk('What approvals are pending?')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Pending approvals</button>
        <button @click="copilotAsk('Which items are aging in a phase?')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Aging items</button>
    </div>

    <!-- Input — the guided interview answers through the ONE input while a
         session is active; chat otherwise (one thread, one input) -->
    <div class="px-4 pb-4" x-show="interviewSession && !interviewSession.done" x-cloak>
        <form @submit.prevent="interviewAnswer(copilotInput); copilotInput = ''" class="relative flex items-center gap-2">
            <div class="relative flex-1">
                <input x-model="copilotInput" type="text" id="interview-input"
                       placeholder="Type your answer…"
                       class="w-full pl-3.5 pr-3 py-2.5 rounded-xl border border-ink-200 text-[12.5px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all bg-white">
            </div>
            <button type="submit" :disabled="interviewBusy || !copilotInput.trim()"
                    class="w-9 h-9 rounded-xl bg-brand-600 text-white flex items-center justify-center hover:bg-brand-700 transition-colors disabled:opacity-40 shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <button type="button" @click="interviewAnswer('', true)" :disabled="interviewBusy || interviewSession.question.required"
                    class="px-2.5 py-2 rounded-xl text-[11px] font-semibold text-ink-500 border border-ink-200 hover:bg-ink-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap shrink-0">Use default</button>
        </form>
    </div>
    <div class="px-4 pb-4" x-show="!(interviewSession && !interviewSession.done)">
        <form @submit.prevent="copilotSubmit()" class="relative">
            <input x-model="copilotInput" type="text" id="copilot-input"
                   placeholder="Ask, or type an action: 'move SSO to Testing'…"
                   class="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-ink-200 text-[12.5px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all bg-white"
                   @keydown.escape="copilotOpen = false">
            <button type="submit" :disabled="copilotBusy || !copilotInput.trim()"
                    class="absolute right-1.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg bg-brand-600 text-white flex items-center justify-center hover:bg-brand-700 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </button>
        </form>
    </div>
</div>

<!-- Copilot launcher button — left of the task FAB (which floats bottom-right, draggable) -->
<button x-show="isLoggedIn && !copilotOpen" x-cloak @click="toggleCopilot()"
        class="fixed bottom-6 right-20 w-11 h-11 rounded-full z-40 bg-ink-900 text-white shadow-lg shadow-ink-900/25 flex items-center justify-center hover:bg-ink-800 hover:scale-105 transition-all"
        title="PMO Copilot">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
    </svg>
</button>

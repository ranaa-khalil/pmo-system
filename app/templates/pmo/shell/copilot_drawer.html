<!-- ==================== PMO COPILOT DRAWER ==================== -->
<!-- Grounded chat + action proposals. Reads show sources; writes require Confirm. -->
<div x-show="copilotOpen" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-x-6"
     x-transition:enter-end="opacity-100 translate-x-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 translate-x-0"
     x-transition:leave-end="opacity-0 translate-x-6"
     class="fixed bottom-6 right-6 w-[400px] h-[600px] max-h-[calc(100vh-3rem)] z-50 surface rounded-2xl shadow-modal border border-ink-200/60 flex flex-col overflow-hidden"
     @keydown.escape.window="copilotOpen = false">
    <!-- Header -->
    <div class="px-4 py-3 border-b border-ink-100 flex items-center justify-between bg-gradient-to-r from-brand-600 to-violet-600">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-white/15 flex items-center justify-center">
                <svg class="w-4.5 h-4.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <div>
                <div class="text-[13px] font-bold text-white leading-tight">PMO Copilot</div>
                <div class="text-[10px] text-white/75 leading-tight flex items-center gap-1">
                    <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        <circle cx="12" cy="10" r="2.5"/>
                    </svg>
                    <span x-text="selectedProject ? selectedProject.name : 'All projects'"></span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Tabs: Chat | Intake -->
            <div class="flex items-center gap-1 bg-white/10 rounded-lg p-0.5">
                <button @click="copilotTab = 'chat'"
                        class="px-2.5 py-1 rounded-md text-[10.5px] font-semibold transition-colors"
                        :class="copilotTab === 'chat' ? 'bg-white text-brand-700' : 'text-white/70 hover:text-white'">Chat</button>
                <button @click="copilotTab = 'intake'"
                        class="px-2.5 py-1 rounded-md text-[10.5px] font-semibold transition-colors"
                        :class="copilotTab === 'intake' ? 'bg-white text-brand-700' : 'text-white/70 hover:text-white'">Intake</button>
            </div>
            <button @click="copilotOpen = false" class="p-1.5 rounded-lg hover:bg-white/10 transition-colors">
                <svg class="w-4 h-4 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- ═══ INTAKE TAB: conversational project initiation ═══ -->
    <div x-show="copilotTab === 'intake'" x-cloak class="flex-1 flex flex-col overflow-hidden">
        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
            <!-- Kickoff input -->
            <template x-if="!intakeDraft && !intakeResult">
                <div class="space-y-3">
                    <div class="bg-ink-100/80 rounded-2xl rounded-bl-md px-3.5 py-2.5 text-[12.5px] text-ink-700 leading-relaxed">
                        Paste your kickoff notes — a paragraph, meeting notes, or a doc. I'll structure them into epics, features, personas, and KPIs. You review, edit, and Apply — nothing is created until you confirm.
                    </div>
                    <textarea x-model="intakeKickoff" rows="7"
                              placeholder="We are building a cloud platform for PNU to manage student services. Students log in with SSO and browse available courses. Faculty members approve registrations and publish grades…"
                              class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[12.5px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all bg-white resize-none"></textarea>
                    <button @click="intakeStructure()" :disabled="intakeBusy || !intakeKickoff.trim()"
                            class="w-full px-4 py-2.5 rounded-xl bg-brand-600 text-white text-[12.5px] font-semibold hover:shadow-md transition-shadow disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" :class="intakeBusy ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path x-show="!intakeBusy" stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            <circle x-show="intakeBusy" cx="12" cy="12" r="9" stroke-dasharray="40" stroke-dashoffset="18"/>
                        </svg>
                        <span x-text="intakeBusy ? 'Structuring…' : 'Structure kickoff'"></span>
                    </button>
                </div>
            </template>

            <!-- Structured draft (review before Apply) -->
            <template x-if="intakeDraft && !intakeResult">
                <div class="space-y-3">
                    <div class="surface rounded-xl border border-ink-200/60 p-3.5">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-0.5 rounded-full bg-violet-100 text-violet-700 text-[9px] font-bold uppercase tracking-wider">Draft</span>
                            <span class="text-[10px] text-ink-400">review before Apply</span>
                        </div>
                        <p class="text-[12.5px] font-semibold text-ink-800" x-text="intakeDraft.summary"></p>
                        <!-- Epics & features -->
                        <div class="mt-3 space-y-2.5" x-show="intakeDraft.epics && intakeDraft.epics.length">
                            <template x-for="(epic, ei) in intakeDraft.epics" :key="ei">
                                <div class="border-l-2 border-brand-300 pl-2.5">
                                    <div class="text-[11.5px] font-bold text-ink-700" x-text="epic.name"></div>
                                    <ul class="mt-1 space-y-0.5">
                                        <template x-for="(feat, fi) in epic.features" :key="fi">
                                            <li class="text-[11.5px] text-ink-500 flex items-start gap-1.5">
                                                <span class="text-brand-400 mt-0.5">•</span>
                                                <span><span class="text-ink-700 font-medium" x-text="feat.title"></span> — <span x-text="feat.description"></span></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>
                        <!-- Personas -->
                        <div class="mt-3" x-show="intakeDraft.personas && intakeDraft.personas.length">
                            <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">Personas</div>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="(p, pi) in intakeDraft.personas" :key="pi">
                                    <span class="px-2 py-0.5 rounded-full bg-ink-100 border border-ink-200 text-[10.5px] font-medium text-ink-600" x-text="p.name"></span>
                                </template>
                            </div>
                        </div>
                        <!-- KPIs -->
                        <div class="mt-3" x-show="intakeDraft.kpis && intakeDraft.kpis.length">
                            <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">KPIs</div>
                            <div class="space-y-0.5">
                                <template x-for="(k, ki) in intakeDraft.kpis" :key="ki">
                                    <div class="text-[11.5px] text-ink-600"><span class="font-medium text-ink-700" x-text="k.name"></span> — target <span x-text="k.target"></span></div>
                                </template>
                            </div>
                        </div>
                        <!-- Assumptions -->
                        <div class="mt-3 bg-amber-50/70 border border-amber-100 rounded-lg p-2.5" x-show="intakeDraft.assumptions && intakeDraft.assumptions.length">
                            <div class="text-[10px] font-bold text-amber-600 uppercase tracking-wider mb-1">Assumptions</div>
                            <template x-for="(a, ai) in intakeDraft.assumptions" :key="ai">
                                <div class="text-[11px] text-amber-700" x-text="'· ' + a"></div>
                            </template>
                        </div>
                    </div>
                    <!-- Apply bar (the only write) -->
                    <div class="flex items-center gap-2">
                        <button @click="intakeDraft = null"
                                class="flex-1 px-3 py-2 rounded-xl text-[12px] font-semibold text-ink-500 hover:bg-ink-100 transition-colors">Discard</button>
                        <button @click="intakeApply()" :disabled="intakeApplying"
                                class="flex-1 px-3 py-2 rounded-xl bg-emerald-600 text-white text-[12px] font-semibold hover:bg-emerald-700 transition-colors disabled:opacity-50 flex items-center justify-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            <span x-text="intakeApplying ? 'Applying…' : 'Apply intake'"></span>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Applied result -->
            <template x-if="intakeResult">
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        <span class="text-[13px] font-bold text-emerald-800">Intake applied</span>
                    </div>
                    <div class="text-[12px] text-emerald-700 space-y-0.5">
                        <div x-text="`${intakeResult.features_created} features created${intakeResult.features_skipped ? ' · ' + intakeResult.features_skipped + ' duplicates skipped' : ''}`"></div>
                        <div x-text="`${intakeResult.personas_created} personas · ${intakeResult.kpis_created} KPIs`"></div>
                    </div>
                    <div class="text-[10.5px] text-emerald-600">Every record carries its intake source. Review them in Backlog and Releases.</div>
                    <button @click="intakeKickoff = ''; intakeDraft = null; intakeResult = null"
                            class="text-[11px] font-semibold text-emerald-700 hover:text-emerald-800 underline">Structure another kickoff</button>
                </div>
            </template>
        </div>
    </div>

    <!-- ═══ CHAT TAB ═══ -->
    <div x-show="copilotTab === 'chat'" x-cloak class="flex-1 flex flex-col overflow-hidden">
    <!-- Messages -->
    <div id="copilot-messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
        <template x-for="(msg, idx) in copilotMessages" :key="idx">
            <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-[12.5px] leading-relaxed"
                     :class="msg.role === 'user'
                         ? 'bg-brand-600 text-white rounded-br-md'
                         : (msg.error ? 'bg-rose-50 text-rose-700 border border-rose-200 rounded-bl-md' : 'bg-ink-100/80 text-ink-700 rounded-bl-md')">
                    <span x-text="msg.text"></span>

                    <!-- Source chips (grounding rule: every answer cites records) -->
                    <template x-if="msg.sources && msg.sources.length > 0">
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <template x-for="(src, si) in msg.sources" :key="si">
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-white border border-ink-200 text-[10px] font-medium text-ink-500"
                                      x-text="src"></span>
                            </template>
                        </div>
                    </template>

                    <!-- Proposal operations (draft → confirm): op card per operation -->
                    <template x-if="msg.ops && msg.ops.length > 0">
                        <div class="mt-2.5 space-y-1.5">
                            <template x-for="(op, oi) in msg.ops" :key="oi">
                                <div class="rounded-xl border border-violet-200 bg-violet-50/50 px-3 py-2">
                                    <div class="flex items-center gap-2">
                                        <span class="px-1.5 py-0.5 rounded-md bg-violet-600 text-white font-bold uppercase tracking-wide text-[8.5px]"
                                              x-text="op.op === 'advance_item' ? 'Advance' : op.op === 'assign_user' ? 'Assign' : op.op === 'create_risk_draft' ? 'Risk draft' : 'Escalate'"></span>
                                        <span class="text-[11.5px] font-semibold text-ink-800"
                                              x-text="op.title || op.description || ('Item ' + (op.item_id || op.approval_id || op.project_id))"></span>
                                    </div>
                                    <div class="mt-1 text-[10.5px] text-ink-500 flex items-center gap-1.5">
                                        <template x-if="op.target_phase"><span x-text="'→ ' + op.target_phase"></span></template>
                                        <template x-if="op.assignee_id"><span x-text="'→ user #' + op.assignee_id"></span></template>
                                        <template x-if="op.note"><span x-text="op.note"></span></template>
                                        <template x-if="!op.target_phase && !op.assignee_id && !op.note"><span x-text="'record #' + (op.item_id || op.approval_id || op.project_id)"></span></template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Typing indicator -->
        <template x-if="copilotBusy">
            <div class="flex justify-start">
                <div class="bg-ink-100/80 rounded-2xl rounded-bl-md px-4 py-3 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-bounce"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-bounce" style="animation-delay: 0.15s"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-bounce" style="animation-delay: 0.3s"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Confirm / Reject bar (write proposals) -->
    <template x-if="copilotPendingProposal">
        <div class="px-4 py-2.5 border-t border-amber-200 bg-amber-50/80 flex items-center gap-2">
            <div class="flex-1 text-[11px] font-medium text-amber-700">
                Confirm to execute — nothing has been written yet.
            </div>
            <button @click="copilotReject()"
                    class="px-3 py-1.5 rounded-lg text-[11px] font-semibold text-ink-500 hover:bg-ink-100 transition-colors">
                Discard
            </button>
            <button @click="copilotConfirm()"
                    class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-[11px] font-semibold hover:bg-emerald-700 transition-colors flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
                Confirm
            </button>
        </div>
    </template>

    <!-- Suggested prompts -->
    <div class="px-4 pb-2 flex flex-wrap gap-1.5" x-show="copilotMessages.length <= 2">
        <button @click="copilotAsk('What is overdue for me?')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">What's overdue?</button>
        <button @click="copilotAsk('What approvals are pending?')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Pending approvals</button>
        <button @click="copilotAsk('Which items are aging in a phase?')"
                class="px-2.5 py-1 rounded-full bg-ink-100/80 hover:bg-ink-200/60 text-[10.5px] font-medium text-ink-500 transition-colors">Aging items</button>
    </div>

    <!-- Input -->
    <div class="px-4 pb-4">
        <form @submit.prevent="copilotSubmit()" class="relative">
            <input x-model="copilotInput" type="text" id="copilot-input"
                   placeholder="Ask, or type an action: 'move SSO to Testing'…"
                   class="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-ink-200 text-[12.5px] focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition-all bg-white"
                   @keydown.escape="copilotOpen = false">
            <button type="submit" :disabled="copilotBusy || !copilotInput.trim()"
                    class="absolute right-1.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg bg-brand-600 text-white flex items-center justify-center hover:bg-brand-700 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </button>
        </form>
    </div>
    </div><!-- /chat tab -->
</div>

<!-- Copilot launcher button — left of the task FAB (which floats bottom-right, draggable) -->
<button x-show="isLoggedIn && !copilotOpen" x-cloak @click="toggleCopilot()"
        class="fixed bottom-6 right-20 w-11 h-11 rounded-full z-40 bg-ink-900 text-white shadow-lg shadow-ink-900/25 flex items-center justify-center hover:bg-ink-800 hover:scale-105 transition-all"
        title="PMO Copilot">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
    </svg>
</button>

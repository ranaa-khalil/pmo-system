        <!-- Topbar — glassmorphic sticky -->
        <header class="sticky top-0 z-30 glass border-b border-ink-200/40">
            <div class="h-16 px-8 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2.5 text-[13px]">
                        <span class="text-ink-400 font-medium">Obelion</span>
                        <svg class="w-3 h-3 text-ink-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                        <span class="text-ink-700 font-semibold" x-text="pageTitle"></span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Notification Bell -->
                    <div class="relative" @click.away="notifPanelOpen = false">
                        <button @click="toggleNotifPanel()" class="relative p-2 rounded-lg hover:bg-ink-100 transition-colors">
                            <svg class="w-5 h-5 text-ink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                            <span x-show="unreadCount > 0" x-cloak
                                  class="absolute top-1 right-1 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center"
                                  x-text="unreadCount > 9 ? '9+' : unreadCount"></span>
                        </button>
                        <!-- Notification Dropdown Panel -->
                        <div x-show="notifPanelOpen" x-cloak
                             x-transition:enter="transition ease-out duration-200"
                             x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                             x-transition:leave="transition ease-in duration-150"
                             x-transition:leave-start="opacity-100 scale-100"
                             x-transition:leave-end="opacity-0 scale-95"
                             class="absolute right-0 top-full mt-2 w-96 bg-white rounded-2xl shadow-xl border border-ink-200/60 overflow-hidden z-50">
                            <div class="px-4 py-3 border-b border-ink-100 flex items-center justify-between">
                                <span class="text-[13px] font-semibold text-ink-800">Notifications</span>
                                <button x-show="unreadCount > 0" @click="markAllNotifsRead()" class="text-[11px] text-brand-600 hover:text-brand-700 font-medium">Mark all read</button>
                            </div>
                            <div class="max-h-96 overflow-y-auto">
                                <template x-if="notifications.length === 0">
                                    <div class="px-4 py-8 text-center">
                                        <svg class="w-8 h-8 mx-auto text-ink-300 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                                        <p class="text-[12px] text-ink-400">No notifications yet</p>
                                    </div>
                                </template>
                                <template x-for="n in notifications" :key="n.id">
                                    <div @click="markNotifRead(n)" class="px-4 py-3 border-b border-ink-50 hover:bg-ink-50/50 cursor-pointer transition-colors"
                                         :class="!n.read ? 'bg-brand-50/30' : ''">
                                        <div class="flex items-start gap-3">
                                            <div class="w-8 h-8 rounded-lg flex items-center justify-center text-[14px] flex-shrink-0" :class="notifColor(n.type)" x-text="notifIcon(n.type)"></div>
                                            <div class="flex-1 min-w-0">
                                                <p class="text-[12px] font-semibold text-ink-800" x-text="n.title"></p>
                                                <p x-show="n.body" class="text-[11px] text-ink-500 mt-0.5 line-clamp-2" x-text="n.body"></p>
                                                <p class="text-[10px] text-ink-400 mt-1" x-text="formatTimeAgo(n.created_at)"></p>
                                            </div>
                                            <button x-show="!n.read" class="w-2 h-2 rounded-full bg-brand-500 flex-shrink-0 mt-1.5"></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-50/80 border border-emerald-100/50">
                        <span class="relative flex w-2 h-2">
                            <span class="absolute inline-flex w-full h-full rounded-full bg-emerald-400 opacity-60 animate-ping"></span>
                            <span class="relative inline-flex w-2 h-2 rounded-full bg-emerald-500"></span>
                        </span>
                        <span class="text-[11px] font-semibold text-emerald-700">Live</span>
                    </div>
                    <div class="text-[11px] text-ink-400 font-medium tabular-nums" x-text="currentTime"></div>
                </div>
            </div>
        </header>

            <!-- ============ ADMIN: PLANS ============ -->
            <div x-show="route === 'admin-plans' && !selectedTenantDetail" x-cloak class="view-enter space-y-6 max-w-7xl">
                <!-- Header -->
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-[28px] font-bold text-ink-900 tracking-tight">Plans</h1>
                        <p class="text-[14px] text-ink-500 mt-1.5">Manage subscription plans and resource limits.</p>
                    </div>
                    <button @click="loadAdminPlans()" class="text-[13px] font-medium text-ink-600 hover:text-ink-800 bg-ink-100 hover:bg-ink-200 px-4 py-2 rounded-xl transition-all">Refresh</button>
                </div>

                <!-- Add plan button -->
                <div class="flex justify-end mb-3">
                    <button @click="showPlanForm = !showPlanForm" class="inline-flex items-center gap-1.5 text-[13px] font-medium text-white btn-primary px-4 py-2.5 rounded-xl transition-all"
                            x-text="showPlanForm ? 'Close' : '+ Add Plan'"></button>
                </div>

                <!-- Add/Edit plan form -->
                <div x-show="showPlanForm" x-cloak class="surface rounded-2xl border border-ink-200/60 p-6">
                    <h3 class="text-[14px] font-semibold text-ink-800 mb-4" x-text="editingPlanId ? 'Edit Plan' : 'Create New Plan'"></h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <input x-model="planForm.name" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Plan name">
                        <input x-model="planForm.description" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Description">
                        <input x-model="planForm.price_monthly" type="number" min="0" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Monthly price (SAR)">
                        <input x-model="planForm.price_yearly" type="number" min="0" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Yearly price (SAR)">
                        <input x-model="planForm.max_users" type="number" min="1" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Max users">
                        <input x-model="planForm.max_projects" type="number" min="1" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Max projects">
                        <input x-model="planForm.max_clients" type="number" min="1" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Max clients">
                        <input x-model="planForm.sort_order" type="number" min="0" class="input-premium text-[13px] rounded-[10px] px-3 py-2" placeholder="Sort order">
                        <label class="flex items-center gap-2 text-[12px] text-ink-600">
                            <input type="checkbox" x-model="planForm.is_active" class="rounded"> Active
                        </label>
                    </div>
                    <div class="flex items-center gap-2 mt-4">
                        <button @click="savePlan()" class="text-[13px] font-medium text-white btn-primary px-4 py-2 rounded-xl transition-all" x-text="editingPlanId ? 'Update Plan' : 'Create Plan'"></button>
                        <button @click="showPlanForm = false; editingPlanId = null; resetPlanForm()" class="text-[13px] text-ink-500 hover:text-ink-800 px-3 py-2">Cancel</button>
                    </div>
                </div>

                <!-- Plans table -->
                <div class="surface rounded-2xl border border-ink-200/60 p-6">
                    <h3 class="text-[14px] font-semibold text-ink-800 mb-4">All Plans</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[13px]">
                            <thead>
                                <tr class="text-left text-[11px] font-semibold text-ink-400 uppercase tracking-wider border-b border-ink-100">
                                    <th class="pb-3 pr-4">Plan</th>
                                    <th class="pb-3 pr-4">Users</th>
                                    <th class="pb-3 pr-4">Projects</th>
                                    <th class="pb-3 pr-4">Clients</th>
                                    <th class="pb-3 pr-4">Monthly</th>
                                    <th class="pb-3 pr-4">Yearly</th>
                                    <th class="pb-3 pr-4 text-center">Tenants</th>
                                    <th class="pb-3 pr-4">Status</th>
                                    <th class="pb-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="p in (adminPlans || [])" :key="p.id">
                                    <tr class="border-b border-ink-100/60 hover:bg-ink-50/50 transition-colors">
                                        <td class="py-3 pr-4">
                                            <div class="font-semibold text-ink-900" x-text="p.name"></div>
                                            <div class="text-[10px] text-ink-400" x-text="p.description"></div>
                                        </td>
                                        <td class="py-3 pr-4 text-ink-700" x-text="p.max_users >= 999999 ? '∞' : p.max_users"></td>
                                        <td class="py-3 pr-4 text-ink-700" x-text="p.max_projects >= 999999 ? '∞' : p.max_projects"></td>
                                        <td class="py-3 pr-4 text-ink-700" x-text="p.max_clients >= 999999 ? '∞' : p.max_clients"></td>
                                        <td class="py-3 pr-4 text-ink-700" x-text="p.price_monthly > 0 ? p.price_monthly + ' SAR' : 'Free'"></td>
                                        <td class="py-3 pr-4 text-ink-700" x-text="p.price_yearly > 0 ? p.price_yearly + ' SAR' : '—'"></td>
                                        <td class="py-3 pr-4 text-center font-medium text-ink-700" x-text="p.tenant_count || 0"></td>
                                        <td class="py-3 pr-4">
                                            <span class="text-[9px] font-bold px-2 py-1 rounded uppercase tracking-wider"
                                                  :class="p.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-ink-200 text-ink-500'"
                                                  x-text="p.is_active ? 'Active' : 'Inactive'"></span>
                                        </td>
                                        <td class="py-3" @click.stop>
                                            <div class="flex items-center gap-1">
                                                <button @click="editPlan(p)" class="text-[10px] font-medium text-brand-600 hover:bg-brand-50 px-2 py-1 rounded-lg transition-colors">Edit</button>
                                                <button @click="deletePlan(p.id, p.name)" x-show="(p.tenant_count || 0) === 0" class="text-[10px] font-medium text-rose-600 hover:bg-rose-50 px-2 py-1 rounded-lg transition-colors">Delete</button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div x-show="adminPlans && adminPlans.length === 0" class="text-center py-8 text-[13px] text-ink-400">No plans yet. Click "+ Add Plan" to create one.</div>
                </div>
            </div>

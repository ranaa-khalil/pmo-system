                                        <span class="w-1.5 h-1.5 rounded-full" :class="p.status === 'Active' ? 'bg-emerald-400' : p.status === 'On Hold' ? 'bg-amber-400' : 'bg-ink-300'"></span>
                                        <span x-text="p.status"></span>
                                    </span>
                                </div>
                                <h3 class="relative text-[15px] font-bold text-ink-900 tracking-tight mb-1" x-text="p.name"></h3>

                                    <div class="ml-auto flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity" @click.stop>
                                        <button @click="openProjectModal(p)" class="p-2 text-ink-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            <!-- ============ CLIENT DETAIL VIEW ============ -->
            <!-- Rethink v2 Phase B3: the ACCOUNT REVIEW — an engagements
                 section at the top over the shipped engagements API (one card
                 per engagement: name, status chip, dates, contract_value
                 verbatim, pmo lead, projects rollup chips → the project,
                 per-project health with why). Lazy: the view-root x-effect
                 fetches when the client-detail first shows — never part of
                 any burst. JS: static/js/app/domains/engagements.js. -->
<template x-if="route === 'client-detail' && selectedClient">            <div class="view-enter space-y-6 max-w-5xl"
                 x-effect="route === 'client-detail' && selectedClient && loadClientEngagements()">
                <!-- Back button -->
                <button @click="backToClients()" class="flex items-center gap-2 text-[13px] text-ink-500 hover:text-ink-800 transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back to Clients
                </button>

                <!-- ============ ENGAGEMENTS — the account review (Rethink v2 Phase B3) ============ -->
                <!-- One card per engagement over the shipped engagements API.
                     Zero search fields: the review renders on open. -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[17px] font-bold text-ink-900">Engagements</h2>
                        <span class="text-[11px] text-ink-400" x-text="(clientEngagements || []).length + ((clientEngagements || []).length === 1 ? ' engagement' : ' engagements')"></span>
                    </div>

                    <!-- Loading -->
                    <div x-show="engagementsLoading" class="space-y-1.5">
                        <div class="h-20 surface rounded-2xl border border-ink-200/60 animate-pulse"></div>
                        <div class="h-20 surface rounded-2xl border border-ink-200/60 animate-pulse"></div>
                    </div>

                    <!-- Empty state: the next action is the API (the create form is a later slice) -->
                    <div x-show="!engagementsLoading && (clientEngagements || []).length === 0" class="surface rounded-2xl border border-ink-200/60 p-8 text-center">
                        <p class="text-[13px] font-semibold text-ink-700">No engagements yet for this client.</p>
                        <p class="text-[11.5px] text-ink-400 mt-0.5">Engagements are opened via the API for now — the create form ships in a later slice.</p>
                    </div>

                    <!-- Engagement cards: name · status chip · dates · contract_value verbatim · pmo lead · rollup -->
                    <div x-show="!engagementsLoading" class="space-y-4">
                        <template x-for="e in (clientEngagements || [])" :key="'eng-' + e.id">
                            <div class="surface rounded-2xl border border-ink-200/60 p-5">
                                <div class="flex items-start justify-between gap-3 mb-3">
                                    <div class="min-w-0">
                                        <h3 class="text-[15px] font-bold text-ink-900 tracking-tight" x-text="e.name"></h3>
                                        <div class="flex items-center gap-3 mt-1 text-[11px] text-ink-400 flex-wrap">
                                            <span x-text="(engagementDate(e.start_date) || '—') + (e.end_date ? ' → ' + engagementDate(e.end_date) : '')"></span>
                                            <span x-show="e.contract_value" class="inline-flex items-center gap-1">
                                                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M9 8h.01M5 21h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                                                <span class="font-medium text-ink-600" x-text="e.contract_value"></span>
                                            </span>
                                            <span class="inline-flex items-center gap-1">
                                                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                                <span x-text="'PMO lead ' + engagementLead(e.pmo_lead_id)"></span>
                                            </span>
                                        </div>
                                    </div>
                                    <span class="flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-lg flex-shrink-0"
                                          :class="engagementStatusChipClass(e.status)">
                                        <span class="w-1.5 h-1.5 rounded-full" :class="engagementStatusDotClass(e.status)"></span>
                                        <span x-text="e.status"></span>
                                    </span>
                                </div>
                                <p x-show="e.notes" class="text-[12px] text-ink-500 whitespace-pre-wrap mb-3" x-text="e.notes"></p>

                                <!-- Projects rollup (from GET /api/engagements/{id}): count + chips → the project,
                                     each with its computed health (why strings, non-empty only; amber for warnings) -->
                                <div x-show="(e.projects?.items || []).length > 0" class="pt-3 border-t border-ink-100">
                                    <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-2">
                                        Projects · <span x-text="e.projects?.count ?? 0"></span>
                                    </div>
                                    <div class="space-y-2">
                                        <template x-for="proj in (e.projects?.items || [])" :key="'eng-proj-' + e.id + '-' + proj.id">
                                            <div class="flex flex-wrap items-center gap-1.5">
                                                <button @click="openProjectById(proj.id)" title="Open this project"
                                                        class="inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full bg-white border border-ink-200 text-ink-700 hover:bg-brand-50 hover:text-brand-700 transition-colors cursor-pointer">
                                                    <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" :class="proj.status === 'Active' ? 'bg-emerald-400' : proj.status === 'On Hold' ? 'bg-amber-400' : 'bg-ink-300'"></span>
                                                    <span class="max-w-[220px] truncate" x-text="proj.name"></span>
                                                    <span class="text-ink-400" x-text="proj.status"></span>
                                                </button>
                                                <template x-if="engagementHealth[proj.id]">
                                                    <div class="flex flex-wrap items-center gap-1">
                                                        <span class="text-[11px] font-bold" :class="healthColor(engagementHealth[proj.id].health_score).split(' ')[0]"
                                                              x-text="engagementHealth[proj.id].health_score + '%'"></span>
                                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full" :class="healthColor(engagementHealth[proj.id].health_score)"
                                                              x-text="engagementHealth[proj.id].status"></span>
                                                        <template x-for="(chip, ci) in (engagementHealth[proj.id].why?.schedule || []).filter(c => c)" :key="'eng-why-s-' + proj.id + '-' + ci">
                                                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-ink-100 text-ink-500" x-text="chip"></span>
                                                        </template>
                                                        <template x-for="(chip, ci) in (engagementHealth[proj.id].why?.approvals || []).filter(c => c)" :key="'eng-why-a-' + proj.id + '-' + ci">
                                                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full"
                                                                  :class="engagementHealth[proj.id].pending_approvals > 0 ? 'bg-amber-50 text-amber-700 border border-amber-200/60' : 'bg-ink-100 text-ink-500'"
                                                                  x-text="chip"></span>
                                                        </template>
                                                        <span x-show="engagementHealth[proj.id].gate_aging > 0"
                                                              class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200/60"
                                                              x-text="'oldest gate ' + engagementHealth[proj.id].gate_aging + 'd'"></span>
                                                        <template x-for="(chip, ci) in (engagementHealth[proj.id].why?.tasks || []).filter(c => c)" :key="'eng-why-t-' + proj.id + '-' + ci">
                                                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full"
                                                                  :class="engagementHealth[proj.id].overdue_tasks > 0 ? 'bg-amber-50 text-amber-700 border border-amber-200/60' : 'bg-ink-100 text-ink-500'"
                                                                  x-text="chip"></span>
                                                        </template>
                                                        <template x-for="(chip, ci) in (engagementHealth[proj.id].why?.kpis || []).filter(c => c)" :key="'eng-why-k-' + proj.id + '-' + ci">
                                                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full"
                                                                  :class="engagementHealth[proj.id].kpis_below_target > 0 ? 'bg-amber-50 text-amber-700 border border-amber-200/60' : 'bg-ink-100 text-ink-500'"
                                                                  x-text="chip"></span>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Client Info -->
                <div class="surface rounded-2xl border border-ink-200/60 p-6">
                    <div class="flex items-start gap-4 mb-5">
                        <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-xl font-bold shadow-sm flex-shrink-0"
                             :class="avatarColor(selectedClient?.name || 'C')"
                             x-text="selectedClient?.name?.charAt(0)"></div>
                        <div class="flex-1 min-w-0">
                            <h1 class="text-[24px] font-bold text-ink-900 tracking-tight" x-text="selectedClient?.name"></h1>
                            <div class="text-[13px] text-ink-400 mt-0.5" x-show="selectedClient?.description" x-html="renderMarkdown(selectedClient?.description)"></div>
                            <p class="text-[13px] text-ink-300 mt-0.5 italic" x-show="!selectedClient?.description">No description</p>
                        </div>
                        <button @click="openClientModal(selectedClient)" class="inline-flex items-center gap-1.5 text-[12px] font-medium text-brand-600 hover:text-brand-700 px-3 py-2 rounded-xl bg-brand-50 hover:bg-brand-100 transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            Edit
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-4 pt-5 border-t border-black/[0.06]">
                        <div>
                            <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">Contact</div>
                            <div class="text-[13px] font-medium text-ink-700" x-text="selectedClient?.contact_name || '—'"></div>
                        </div>
                        <div>
                            <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">Email</div>
                            <div class="text-[13px] font-medium text-ink-700" x-text="selectedClient?.contact_email || '—'"></div>
                        </div>
                        <div>
                            <div class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-1">Projects</div>
                            <div class="text-[13px] font-bold text-brand-600" x-text="projects.filter(p => p.client_id === selectedClient?.id).length"></div>
                        </div>
                    </div>
                </div>

                <!-- Related Projects -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[17px] font-bold text-ink-900">Projects</h2>
                        <button @click="openProjectModal({ client_id: selectedClient?.id })" class="inline-flex items-center gap-1.5 text-[12px] font-medium text-white btn-primary px-3 py-2 rounded-xl transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                            Add Project
                        </button>
                    </div>

                    <template x-if="projects.filter(p => p.client_id === selectedClient?.id).length === 0">
                        <div class="surface rounded-2xl border border-ink-200/60 p-8 text-center text-[13px] text-ink-400">No projects yet for this client.</div>
                    </template>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <template x-for="p in projects.filter(p => p.client_id === selectedClient?.id)" :key="p.id">
                            <div @click="openProject(p)" class="relative surface rounded-2xl border border-ink-200/60 p-5 card-lift overflow-hidden group cursor-pointer">
                                <div class="absolute top-0 right-0 w-20 h-20 rounded-full blur-2xl opacity-10 bg-gradient-to-br from-brand-400 to-violet-500 group-hover:opacity-20 transition-opacity"></div>
                                <div class="relative flex items-start justify-between mb-4">
                                    <div class="w-11 h-11 rounded-2xl bg-brand-600 flex items-center justify-center shadow-sm">
                                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>
                                    </div>
                                    <span class="flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-lg"
                                          :class="p.status === 'Active' ? 'bg-emerald-50 text-emerald-600' : p.status === 'On Hold' ? 'bg-amber-50 text-amber-600' : 'bg-ink-100 text-ink-500'">
                                        <span class="w-1.5 h-1.5 rounded-full" :class="p.status === 'Active' ? 'bg-emerald-400' : p.status === 'On Hold' ? 'bg-amber-400' : 'bg-ink-300'"></span>
                                        <span x-text="p.status"></span>
                                    </span>
                                </div>
                                <h3 class="relative text-[15px] font-bold text-ink-900 tracking-tight mb-1" x-text="p.name"></h3>
                                <p class="relative text-[12px] text-ink-500 line-clamp-2 mb-4 min-h-[2rem]" x-text="p.description || ''"></p>
                                <div class="relative flex items-center gap-2 pt-3 border-t border-ink-100">
                                    <template x-if="p.github_repo">
                                        <a :href="'https://github.com/' + p.github_repo" target="_blank" @click.stop class="inline-flex items-center gap-1.5 text-[11px] font-medium text-ink-500 hover:text-ink-700 bg-ink-100 hover:bg-ink-100 px-2 py-1 rounded-lg transition-colors">
                                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                                            <span x-text="p.github_repo"></span>
                                        </a>
                                    </template>
                                    <div class="ml-auto flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity" @click.stop>
                                        <button @click="openProjectModal(p)" class="p-2 text-ink-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Client Portal (P4) -->
                {% include 'pmo/modals/portal_setup.html' %}
            </div></template>

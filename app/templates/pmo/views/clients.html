            <!-- ============ CLIENTS VIEW ============ -->
            <div x-show="route === 'clients'" class="view-enter space-y-5 max-w-7xl">
                <div class="flex items-end justify-between">
                    <div>
                        <h1 class="text-[28px] font-bold text-ink-900 tracking-tight">Clients</h1>
                        <p class="text-[14px] text-ink-500 mt-1.5">Manage client organizations and their contacts.</p>
                    </div>
                    <button @click="openClientModal()" class="btn-primary inline-flex items-center gap-2 text-[13px] font-medium text-white px-4 py-2.5 rounded-[10px] transition-all">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                        New Client
                    </button>
                </div>

                <div class="surface rounded-2xl border border-ink-200/60 overflow-hidden shadow-soft">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-black/[0.06]">
                                    <th class="text-left text-[11px] font-semibold text-ink-400 uppercase tracking-wider px-6 py-3">Name</th>
                                    <th class="text-left text-[11px] font-semibold text-ink-400 uppercase tracking-wider px-6 py-3">Contact</th>
                                    <th class="text-left text-[11px] font-semibold text-ink-400 uppercase tracking-wider px-6 py-3">Email</th>
                                    <th class="text-left text-[11px] font-semibold text-ink-400 uppercase tracking-wider px-6 py-3">Description</th>
                                    <th class="text-right text-[11px] font-semibold text-ink-400 uppercase tracking-wider px-6 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-ink-100">
                                <template x-if="clients.length === 0">
                                    <tr><td colspan="5" class="text-center py-16">
                                        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-ink-100 flex items-center justify-center">
                                            <svg class="w-7 h-7 text-ink-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                                        </div>
                                        <p class="text-[13px] text-ink-400">No clients yet</p>
                                    </td></tr>
                                </template>
                                <template x-for="c in clients" :key="c.id">
                                    <tr class="group hover:bg-ink-100/50 transition-colors cursor-pointer" @click="openClient(c)">
                                        <td class="px-6 py-4">
                                            <div class="flex items-center gap-3">
                                                <div class="w-9 h-9 rounded-xl flex items-center justify-center text-xs font-bold text-white shadow-sm"
                                                     :class="avatarColor(c.name)"
                                                     x-text="c.name.charAt(0)"></div>
                                                <div>
                                                    <span class="text-[13px] font-semibold text-ink-800 group-hover:text-brand-600 transition-colors" x-text="c.name"></span>
                                                    <div class="text-[10px] text-ink-400" x-text="(projects.filter(p => p.client_id === c.id).length) + ' project(s)'"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-[13px] text-ink-600" x-text="c.contact_name || '—'"></td>
                                        <td class="px-6 py-4 text-[13px] text-ink-500" x-text="c.contact_email || '—'"></td>
                                        <td class="px-6 py-4 text-[13px] text-ink-400 max-w-xs truncate" x-text="c.description || '—'"></td>
                                        <td class="px-6 py-4 text-right" @click.stop>
                                            <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button @click="openClientModal(c)" class="p-2 text-ink-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="Edit">
                                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                                </button>
                                                <button @click="deleteClient(c)" class="p-2 text-ink-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Delete">
                                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

                                <svg class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                                Pending Approvals
                            </h2>
                            <template x-if="!dashStats?.pending_approval_details || dashStats.pending_approval_details.length === 0">
                                <div class="text-[12px] text-ink-400 bg-ink-100 rounded-xl p-4 text-center">No pending approvals.</div>
                            </template>
                            <div class="space-y-2">
                                <template x-for="apv in (dashStats?.pending_approval_details || [])" :key="apv.id">
                                    <div class="p-2.5 rounded-xl bg-ink-100/60">
                                        <div class="flex items-center justify-between">
                                            <div class="text-[12px] font-medium text-ink-700 truncate" x-text="apv.title"></div>
                                            <span class="text-[10px] font-medium text-amber-600 ml-2" x-text="apv.approved_steps + '/' + apv.total_steps"></span>
                                        </div>
                                        <div class="text-[10px] text-ink-400 mt-0.5" x-text="apv.project_name + ' · ' + apv.request_type"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- KPI Progress Row -->
                <div class="surface rounded-2xl border border-ink-200/60 p-5" x-show="dashStats?.kpi_progress && dashStats.kpi_progress.length > 0">
                    <h2 class="text-[14px] font-semibold text-ink-800 mb-4">KPI Progress</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <template x-for="kpi in (dashStats?.kpi_progress || [])" :key="kpi.id">
                            <div class="p-3 rounded-xl bg-gradient-to-br from-slate-50 to-brand-50/20 border border-black/[0.06]">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="text-[12px] font-medium text-ink-700 truncate" x-text="kpi.name"></div>
                                    <span class="text-[10px] text-ink-400" x-text="kpi.project_name"></span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <div class="text-[16px] font-bold tabular-nums" :class="kpiProgressPct(kpi) >= 75 ? 'text-emerald-600' : kpiProgressPct(kpi) >= 50 ? 'text-brand-600' : 'text-rose-600'">
                                        <span x-text="kpiDisplayValue(kpi, 'current_value')"></span><span class="text-ink-300 text-[12px]"> / </span><span x-text="kpiDisplayValue(kpi, 'target_value')" class="text-[12px] text-ink-500"></span>
                                    </div>
                                </div>
                                <div class="mt-2 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500"
                                         :class="kpiProgressPct(kpi) >= 75 ? 'bg-emerald-400' : kpiProgressPct(kpi) >= 50 ? 'bg-brand-400' : 'bg-rose-400'"
                                         :style="'width: ' + kpiProgressPct(kpi) + '%'"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- My Tasks Widget — dashboard only -->
                <div class="surface rounded-2xl border border-ink-200/60 p-5" x-show="route === 'dashboard' && taskSummary && taskSummary.active > 0">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[14px] font-semibold text-ink-800">My Tasks</h2>
                        <button @click="navigate('tasks')" class="text-[12px] font-medium text-brand-600 hover:text-brand-700">View all →</button>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="text-center p-3 rounded-xl bg-ink-100">
                            <div class="text-[20px] font-bold text-ink-700" x-text="taskSummary.pending ?? 0"></div>
                            <div class="text-[10px] text-ink-400 uppercase tracking-wide mt-0.5">Pending</div>
                        </div>
                        <div class="text-center p-3 rounded-xl" :class="taskSummary.due_soon > 0 ? 'bg-amber-50' : 'bg-ink-100'">
                            <div class="text-[20px] font-bold" :class="taskSummary.due_soon > 0 ? 'text-amber-600' : 'text-ink-700'" x-text="taskSummary.due_soon ?? 0"></div>
                            <div class="text-[10px] text-ink-400 uppercase tracking-wide mt-0.5">Due Soon</div>
                        </div>
                        <div class="text-center p-3 rounded-xl" :class="taskSummary.overdue > 0 ? 'bg-rose-50' : 'bg-ink-100'">
                            <div class="text-[20px] font-bold" :class="taskSummary.overdue > 0 ? 'text-rose-600' : 'text-ink-700'" x-text="taskSummary.overdue ?? 0"></div>
                            <div class="text-[10px] text-ink-400 uppercase tracking-wide mt-0.5">Overdue</div>
                        </div>
                    </div>
                </div>

                <!-- Activity Feed -->
                <div class="surface rounded-2xl border border-ink-200/60 p-5" x-show="route === 'dashboard'">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[14px] font-semibold text-ink-800">Recent Activity</h2>
                        <button @click="loadActivity()" :disabled="activityLoading" class="w-7 h-7 flex items-center justify-center rounded-lg text-ink-400 hover:text-brand-600 hover:bg-ink-100 transition-colors disabled:opacity-50" title="Refresh">
                            <svg class="w-3.5 h-3.5" :class="activityLoading ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                        </button>
                    </div>
                    <template x-if="activityFeed.length === 0">
                        <p class="text-[12px] text-ink-400 py-4 text-center">No recent activity</p>
                    </template>
                    <div class="space-y-1">
                        <template x-for="a in activityFeed.slice(0, 8)" :key="a.id">
                            <div class="flex items-start gap-3 py-2 px-2 rounded-lg hover:bg-ink-50/50 transition-colors">
                                <div class="w-7 h-7 rounded-lg bg-ink-100 flex items-center justify-center text-[12px] flex-shrink-0" :class="activityColor(a.action)" x-text="activityIcon(a.action)"></div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-[12px] text-ink-700" x-text="a.summary"></p>
                                    <p class="text-[10px] text-ink-400 mt-0.5">
                                        <span x-text="a.user_name || 'System'"></span> · <span x-text="formatTimeAgo(a.created_at)"></span>
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>

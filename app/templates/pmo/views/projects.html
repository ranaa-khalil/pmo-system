            <div x-show="route === 'projects'" class="view-enter space-y-5 max-w-7xl">

                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <select x-model="projectFilter" @change="loadProjects()" class="appearance-none input-premium text-[12px] font-medium rounded-[10px] pl-3 pr-8 py-2 bg-white text-ink-600 cursor-pointer">
                                <option value="">All Clients</option>
                                <template x-for="c in clients" :key="c.id">
                                    <option :value="c.id" x-text="c.name"></option>
                                </template>
                            </select>
                            <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-ink-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>

                            <div class="absolute top-0 right-0 w-20 h-20 rounded-full blur-2xl opacity-10 bg-gradient-to-br from-brand-400 to-violet-500 group-hover:opacity-20 transition-opacity"></div>
                            <div class="relative flex items-start justify-between mb-4">
                                <div class="w-11 h-11 rounded-2xl bg-brand-600 flex items-center justify-center shadow-sm">
                                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>
                                </div>
                                <span class="flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-lg"
                                      :class="p.status === 'Active' ? 'bg-emerald-50 text-emerald-600' : p.status === 'On Hold' ? 'bg-amber-50 text-amber-600' : 'bg-ink-100 text-ink-500'">
                                    <span class="w-1.5 h-1.5 rounded-full" :class="p.status === 'Active' ? 'bg-emerald-400' : p.status === 'On Hold' ? 'bg-amber-400' : 'bg-ink-300'"></span>
                                    <span x-text="p.status"></span>
                                </span>
                            </div>
                            <h3 class="relative text-[15px] font-bold text-ink-900 tracking-tight mb-0.5" x-text="p.name"></h3>
                            <p class="relative text-[12px] text-ink-400 mb-3" x-text="getClientName(p.client_id)"></p>
                            <p class="relative text-[12px] text-ink-500 line-clamp-2 mb-4 min-h-[2rem]" x-text="p.description || ''"></p>

                                        <span x-text="p.github_repo"></span>
                                    </a>
                                </template>
                                <div class="ml-auto flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button @click="openProjectModal(p)" class="p-2 text-ink-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    </button>
                                    <button @click="deleteProject(p)" class="p-2 text-ink-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

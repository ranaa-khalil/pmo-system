            <!-- ============ TASKS VIEW ============ -->
            <div x-show="route === 'tasks'" class="view-enter space-y-5 max-w-7xl">
                <!-- Header -->
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-[28px] font-bold text-ink-900 tracking-tight">My Tasks</h1>
                        <p class="text-[14px] text-ink-500 mt-1.5">Personal to-dos with due dates and project links.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="exportTasks()" class="inline-flex items-center gap-1.5 text-[12px] font-medium text-ink-600 hover:text-brand-600 px-3 py-2 rounded-lg border border-ink-200 hover:bg-ink-50 transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            Export
                        </button>
                        <button @click="openTaskModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-brand-600 text-white text-[13px] font-semibold hover:bg-brand-700 transition-colors shadow-sm">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                            New Task
                        </button>
                    </div>
                </div>

                <!-- Summary cards -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3" x-data="{}">
                    <div class="surface rounded-xl border border-ink-200/60 p-4">
                        <div class="text-[11px] font-medium text-ink-500 uppercase tracking-wide">Pending</div>
                        <div class="text-[24px] font-bold text-ink-900 mt-1" x-text="taskSummary.pending ?? 0"></div>
                    </div>
                    <div class="surface rounded-xl border border-ink-200/60 p-4">
                        <div class="text-[11px] font-medium text-ink-500 uppercase tracking-wide">In Progress</div>
                        <div class="text-[24px] font-bold text-blue-600 mt-1" x-text="taskSummary.in_progress ?? 0"></div>
                    </div>
                    <!-- Due Today — clickable -->
                    <button @click="setTodayFilter()" class="surface rounded-xl border p-4 text-left transition-all hover:shadow-md" :class="todayTaskCount > 0 ? 'border-indigo-200 ring-2 ring-indigo-200' : 'border-ink-200/60'">
                        <div class="text-[11px] font-medium uppercase tracking-wide" :class="todayTaskCount > 0 ? 'text-indigo-600' : 'text-ink-500'">Due Today</div>
                        <div class="text-[24px] font-bold mt-1" :class="todayTaskCount > 0 ? 'text-indigo-600' : 'text-ink-900'" x-text="todayTaskCount"></div>
                    </button>
                    <div class="surface rounded-xl border border-amber-200/60 p-4" :class="taskSummary.due_soon > 0 ? 'ring-2 ring-amber-200' : ''">
                        <div class="text-[11px] font-medium text-amber-600 uppercase tracking-wide">Due Soon</div>
                        <div class="text-[24px] font-bold text-amber-600 mt-1" x-text="taskSummary.due_soon ?? 0"></div>
                    </div>
                    <div class="surface rounded-xl border border-rose-200/60 p-4" :class="taskSummary.overdue > 0 ? 'ring-2 ring-rose-200' : ''">
                        <div class="text-[11px] font-medium text-rose-600 uppercase tracking-wide">Overdue</div>
                        <div class="text-[24px] font-bold text-rose-600 mt-1" x-text="taskSummary.overdue ?? 0"></div>
                    </div>
                </div>

                <!-- Filter bar -->
                <div class="flex items-center gap-2 flex-wrap">
                    <!-- Status filters -->
                    <button @click="taskFilter = 'all'" :class="taskFilter === 'all' ? 'bg-brand-600 text-white' : 'bg-white text-ink-600 border border-ink-200'" class="px-3 py-1.5 rounded-lg text-[12px] font-medium transition-colors">All</button>
                    <button @click="setTodayFilter()" :class="taskDateFilter === todayISO() ? 'bg-indigo-600 text-white' : 'bg-white text-ink-600 border border-ink-200'" class="px-3 py-1.5 rounded-lg text-[12px] font-medium transition-colors inline-flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        Today
                    </button>
                    <button @click="taskFilter = 'pending'" :class="taskFilter === 'pending' ? 'bg-brand-600 text-white' : 'bg-white text-ink-600 border border-ink-200'" class="px-3 py-1.5 rounded-lg text-[12px] font-medium transition-colors">Pending</button>
                    <button @click="taskFilter = 'in_progress'" :class="taskFilter === 'in_progress' ? 'bg-brand-600 text-white' : 'bg-white text-ink-600 border border-ink-200'" class="px-3 py-1.5 rounded-lg text-[12px] font-medium transition-colors">In Progress</button>
                    <button @click="taskFilter = 'overdue'" :class="taskFilter === 'overdue' ? 'bg-rose-600 text-white' : 'bg-white text-ink-600 border border-ink-200'" class="px-3 py-1.5 rounded-lg text-[12px] font-medium transition-colors">Overdue</button>
                    <button @click="taskFilter = 'completed'" :class="taskFilter === 'completed' ? 'bg-emerald-600 text-white' : 'bg-white text-ink-600 border border-ink-200'" class="px-3 py-1.5 rounded-lg text-[12px] font-medium transition-colors">Completed</button>
                    <!-- Divider -->
                    <div class="w-px h-6 bg-ink-200 mx-1"></div>
                    <!-- Date picker -->
                    <div class="inline-flex items-center gap-1.5 bg-white border border-ink-200 rounded-lg px-2.5 py-1.5">
                        <svg class="w-3.5 h-3.5 text-ink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <input x-model="taskDateFilter" type="date" class="text-[12px] text-ink-600 border-0 outline-none bg-transparent p-0" style="min-width: 120px;">
                    </div>
                    <!-- Clear date button -->
                    <button x-show="taskDateFilter" @click="taskDateFilter = null" class="px-2.5 py-1.5 rounded-lg text-[12px] font-medium text-ink-500 hover:text-ink-700 hover:bg-ink-100 transition-colors inline-flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        Clear date
                    </button>
                    <!-- Active filter indicator -->
                    <span x-show="taskDateFilter" class="text-[11px] text-ink-400 ml-1">
                        Showing tasks due: <span class="font-medium text-ink-600" x-text="formatDate(taskDateFilter)"></span>
                    </span>
                </div>

                <!-- Task list -->
                <div class="surface rounded-2xl border border-ink-200/60 overflow-hidden">
                    <div x-show="tasksLoading" class="h-[200px] flex items-center justify-center">
                        <svg class="animate-spin w-6 h-6 text-ink-300" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    </div>
                    <div x-show="!tasksLoading && filteredTasks.length === 0" class="h-[200px] flex flex-col items-center justify-center gap-2 text-ink-400">
                        <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                        <span class="text-[14px]">No tasks here. Create one to get started.</span>
                    </div>
                    <div x-show="!tasksLoading && filteredTasks.length > 0" class="divide-y divide-ink-100">
                        <template x-for="task in filteredTasks" :key="task.id">
                            <div class="flex items-start gap-3 px-5 py-3.5 hover:bg-ink-100/50 transition-colors group">
                                <!-- Checkbox / status toggle -->
                                <button @click="toggleTaskStatus(task)" class="mt-0.5 flex-shrink-0 w-5 h-5 rounded-md border-2 transition-all flex items-center justify-center"
                                        :class="task.status === 'Completed' ? 'bg-emerald-500 border-emerald-500' : task.status === 'In Progress' ? 'border-blue-400 bg-blue-50' : 'border-ink-300 hover:border-brand-400'">
                                    <svg x-show="task.status === 'Completed'" class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                </button>

                                <!-- Content -->
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[14px] font-medium" :class="task.status === 'Completed' ? 'text-ink-400 line-through' : 'text-ink-800'" x-text="task.title"></span>
                                        <!-- Priority badge -->
                                        <span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide"
                                              :class="{
                                                'bg-rose-100 text-rose-600': task.priority === 'Urgent',
                                                'bg-orange-100 text-orange-600': task.priority === 'High',
                                                'bg-amber-100 text-amber-600': task.priority === 'Medium',
                                                'bg-ink-100 text-ink-500': task.priority === 'Low'
                                              }" x-text="task.priority"></span>
                                    </div>
                                    <div class="flex items-center gap-3 mt-1 text-[11px] text-ink-400">
                                        <!-- Due date -->
                                        <span x-show="task.due_date" class="inline-flex items-center gap-1"
                                              :class="isOverdue(task) ? 'text-rose-600 font-medium' : isDueSoon(task) ? 'text-amber-600 font-medium' : ''">
                                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                            <span x-text="formatDate(task.due_date)"></span>
                                            <span x-show="isOverdue(task)" class="text-rose-500">⚠ overdue</span>
                                        </span>
                                        <!-- Project link -->
                                        <span x-show="task.project_name" class="inline-flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/></svg>
                                            <span x-text="task.project_name"></span>
                                        </span>
                                        <!-- Milestone link -->
                                        <span x-show="task.milestone_title" class="inline-flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                            <span x-text="task.milestone_title"></span>
                                        </span>
                                        <!-- Status badge -->
                                        <span x-show="task.status === 'In Progress'" class="inline-flex items-center gap-1 text-blue-500">
                                            <svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                            In Progress
                                        </span>
                                    </div>
                                </div>

                                <!-- Actions -->
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button @click="openTaskModal(task)" class="p-1.5 rounded-lg hover:bg-ink-100 text-ink-400 hover:text-ink-600" title="Edit">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    </button>
                                    <button @click="deleteTask(task.id)" class="p-1.5 rounded-lg hover:bg-rose-50 text-ink-400 hover:text-rose-500" title="Delete">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

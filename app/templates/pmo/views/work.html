<!-- R1: Work — unified cross-project list + detail drawer -->
<div x-show="route === 'work'" x-cloak class="view-enter max-w-6xl">

    <!-- Header + filters -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <h1 class="text-xl font-bold text-ink-900 tracking-tight">Work</h1>
            <p class="text-[12px] text-ink-400 mt-0.5">One list, every project</p>
        </div>
        <div class="flex items-center gap-2">
            <input x-model="workSearch" class="input-premium text-[12px] rounded-xl px-3 py-2 w-48" placeholder="Search work…">
            <select x-model="workProjectFilter" class="input-premium text-[12px] px-3 py-2 rounded-xl bg-white max-w-44">
                <option value="">All projects</option>
                <template x-for="p in projects" :key="p.id">
                    <option :value="p.id" x-text="p.name"></option>
                </template>
            </select>
        </div>
    </div>

    <!-- Filter chips -->
    <div class="flex items-center gap-1.5 mb-4">
        <template x-for="f in [
            { id: 'all', label: 'All' },
            { id: 'mine', label: 'Mine' },
            { id: 'blocked', label: 'Blocked' },
            { id: 'overdue', label: 'Overdue' },
        ]" :key="f.id">
            <button @click="setWorkFilter(f.id)"
                    class="px-3 py-1.5 rounded-lg text-[11px] font-medium transition-all"
                    :class="workFilter === f.id ? 'bg-brand-500 text-white shadow-sm' : 'bg-ink-100 text-ink-500 hover:bg-ink-200/60'"
                    x-text="f.label"></button>
        </template>
        <span class="text-[11px] text-ink-400 ml-1" x-text="workFiltered.length + ' items'"></span>
    </div>

    <!-- List -->
    <div class="space-y-1.5">
        <template x-for="it in workFiltered" :key="it.id">
            <button @click="openWorkItem(it)"
                    class="w-full text-left surface rounded-xl border px-4 py-3 flex items-center gap-3 transition-all hover:bg-brand-50/40"
                    :class="it.blocked ? 'border-amber-200' : it.overdue ? 'border-rose-200' : 'border-ink-200/60'"
                    style="border-left-width: 3px;"
                    :style="it.blocked ? 'border-left-color: #f59e0b' : it.overdue ? 'border-left-color: #f43f5e' : 'border-left-color: #d4d4d8'">
                <span class="text-[11px] font-mono text-ink-400 shrink-0" x-text="'#' + it.id"></span>
                <div class="min-w-0 flex-1">
                    <div class="text-[13px] font-medium text-ink-900 truncate" x-text="it.title"></div>
                    <div class="text-[11px] text-ink-400 mt-0.5 flex items-center gap-1.5 flex-wrap">
                        <span class="px-1.5 py-0.5 rounded bg-ink-100 text-ink-600" x-text="it.project"></span>
                        <span x-text="it.phase"></span>
                        <span x-show="it.target_release" class="text-ink-300">·</span>
                        <span x-show="it.target_release" x-text="'rel ' + it.target_release"></span>
                    </div>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium shrink-0"
                      :class="it.status === 'Done' ? 'bg-emerald-50 text-emerald-600' : it.status === 'Blocked' ? 'bg-amber-50 text-amber-700' : it.status === 'In Progress' ? 'bg-brand-50 text-brand-600' : 'bg-ink-100 text-ink-500'"
                      x-text="it.status"></span>
                <span class="text-[10px] text-rose-500 font-medium shrink-0" x-show="it.overdue">overdue</span>
            </button>
        </template>

        <!-- Empty state -->
        <div x-show="!workLoading && workFiltered.length === 0" class="surface rounded-xl border border-ink-200/60 px-4 py-8 text-center">
            <p class="text-[13px] font-semibold text-ink-700">Nothing here yet</p>
            <p class="text-[11.5px] text-ink-400 mt-0.5">Adjust the filters, or capture something new from Today.</p>
        </div>

        <!-- Loading -->
        <div x-show="workLoading" class="space-y-1.5">
            <div class="h-12 surface rounded-xl border border-ink-200/60 animate-pulse"></div>
            <div class="h-12 surface rounded-xl border border-ink-200/60 animate-pulse"></div>
            <div class="h-12 surface rounded-xl border border-ink-200/60 animate-pulse"></div>
        </div>
    </div>

    <!-- Detail drawer -->
    <div x-show="selectedWorkItem" x-cloak class="fixed inset-0 z-50" style="pointer-events: none;">
        <div class="absolute inset-0 bg-ink-900/20" @click="closeWorkItem()" style="pointer-events: auto;"></div>
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-white shadow-2xl overflow-y-auto"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="translate-x-full"
             x-transition:enter-end="translate-x-0"
             style="pointer-events: auto;">

            <template x-if="selectedWorkItem">
                <div class="p-6">
                    <!-- Header -->
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div class="min-w-0">
                            <div class="text-[11px] font-mono text-ink-400" x-text="'#' + selectedWorkItem.id + ' · ' + selectedWorkItem.project"></div>
                            <h2 class="text-base font-bold text-ink-900 mt-0.5" x-text="selectedWorkItem.title"></h2>
                        </div>
                        <button @click="closeWorkItem()" class="text-ink-400 hover:text-ink-800 p-1 shrink-0">✕</button>
                    </div>

                    <!-- Chips row -->
                    <div class="flex items-center gap-1.5 flex-wrap mb-4">
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-50 text-brand-600 font-medium" x-text="selectedWorkItem.phase"></span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-medium"
                              :class="selectedWorkItem.status === 'Done' ? 'bg-emerald-50 text-emerald-600' : selectedWorkItem.status === 'Blocked' ? 'bg-amber-50 text-amber-700' : 'bg-ink-100 text-ink-500'"
                              x-text="selectedWorkItem.status"></span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-ink-100 text-ink-500" x-text="selectedWorkItem.priority"></span>
                        <span class="text-[10px] text-rose-500 font-medium" x-show="selectedWorkItem.overdue">overdue</span>
                    </div>

                    <!-- Project Brief (AI narrative) -->
                    <div x-show="workDetail?.brief" class="surface rounded-xl border border-ink-200/60 p-4 mb-4 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-0.5 bg-gradient-to-b from-indigo-500 to-violet-500"></div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <svg class="w-3.5 h-3.5 text-violet-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            <span class="text-[9px] font-bold uppercase tracking-wider text-violet-700">Project Brief</span>
                        </div>
                        <p class="text-[12px] text-ink-600 leading-relaxed" x-text="workDetail?.brief?.narrative || ''"></p>
                    </div>

                    <!-- Item detail -->
                    <div x-show="workDetail?.item" class="space-y-3 mb-4">
                        <div x-show="workDetail?.item?.description">
                            <h3 class="text-[10px] font-bold uppercase tracking-wider text-ink-400 mb-1">Description</h3>
                            <p class="text-[12.5px] text-ink-700 leading-relaxed whitespace-pre-wrap" x-text="workDetail?.item?.description || ''"></p>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-[12px]">
                            <div x-show="workDetail?.item?.epic" class="text-ink-500"><span class="text-ink-400">Epic:</span> <span x-text="workDetail?.item?.epic"></span></div>
                            <div x-show="workDetail?.item?.target_release" class="text-ink-500"><span class="text-ink-400">Release:</span> <span x-text="workDetail?.item?.target_release"></span></div>
                            <div x-show="workDetail?.item?.story_points" class="text-ink-500"><span class="text-ink-400">Points:</span> <span x-text="workDetail?.item?.story_points"></span></div>
                            <div x-show="workDetail?.item?.item_type" class="text-ink-500"><span class="text-ink-400">Type:</span> <span x-text="workDetail?.item?.item_type"></span></div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-2 pt-3 border-t border-ink-100">
                        <button @click="openProjectById(selectedWorkItem.project_id)" class="text-[12px] font-medium text-brand-700 border border-brand-200 bg-white px-3.5 py-2 rounded-xl hover:bg-brand-50 transition-all">Open in Projects</button>
                        <span class="text-[11px] text-ink-400 ml-auto" x-show="workDetailLoading">loading…</span>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

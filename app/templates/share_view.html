<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared View — PMO System</title>
    <script nonce="{{ csp_nonce }}" src="/static/tailwind.min.js"></script>
    <script nonce="{{ csp_nonce }}" src="/static/js/app/tailwind-config.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-ink-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <div class="flex items-center gap-2 text-[13px]">
                    <span class="text-ink-400 font-medium">PMO System</span>
                    <span class="text-ink-300">›</span>
                    <span class="text-ink-700 font-semibold">Shared view</span>
                </div>
                <h1 class="text-[22px] font-bold text-ink-900 tracking-tight mt-1" id="title">Shared view</h1>
            </div>
            <span id="generated" class="text-[11px] text-ink-400"></span>
        </div>

        <!-- Error state -->
        <div id="error" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center">
            <p class="text-[15px] font-semibold text-rose-700" id="error-title">Link not available</p>
            <p class="text-[13px] text-rose-500 mt-1" id="error-body"></p>
        </div>

        <!-- Loading -->
        <div id="loading" class="bg-white border border-ink-200/60 rounded-2xl p-10 text-center">
            <p class="text-[13px] text-ink-400">Loading shared view…</p>
        </div>

        <!-- Password form -->
        <div id="pw-card" class="hidden bg-white border border-ink-200/60 rounded-2xl p-6 max-w-sm mx-auto">
            <h2 class="text-[14px] font-semibold text-ink-800 mb-1">This view is protected</h2>
            <p class="text-[12px] text-ink-400 mb-4">Enter the password you were given.</p>
            <input id="pw" type="password" placeholder="Password"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-ink-200 text-[14px] outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400">
            <p id="pw-error" class="hidden text-[12px] text-rose-600 mt-2"></p>
            <button id="pw-btn" class="w-full mt-3 px-4 py-2.5 rounded-xl bg-brand-600 text-white text-[13px] font-semibold hover:bg-brand-700 transition-colors">View</button>
        </div>

        <!-- Content -->
        <div id="content" class="hidden space-y-5">
            <div id="body"></div>
            <p class="text-[11px] text-ink-300 text-center pt-2">Read-only view shared from PMO System</p>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}">
    const TOKEN = window.location.pathname.split('/').pop();
    const $ = (id) => document.getElementById(id);

    async function load(password) {
        const opts = password
            ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) }
            : {};
        try {
            const res = await fetch(`/api/share/${TOKEN}`, opts);
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                $('loading').classList.add('hidden');
                $('pw-card').classList.add('hidden');
                $('error').classList.remove('hidden');
                $('error-title').textContent = res.status === 410 ? 'This link has expired or was revoked' : 'Link not available';
                $('error-body').textContent = err.detail || '';
                return null;
            }
            const data = await res.json();
            if (data.requires_password) {
                $('loading').classList.add('hidden');
                $('pw-card').classList.remove('hidden');
                return null;
            }
            $('loading').classList.add('hidden');
            $('pw-card').classList.add('hidden');
            $('content').classList.remove('hidden');
            render(data);
            return data;
        } catch (e) {
            $('loading').classList.add('hidden');
            $('error').classList.remove('hidden');
            $('error-body').textContent = 'Could not load this view.';
            return null;
        }
    }

    function progressColor(p) {
        if (p >= 80) return 'bg-emerald-500';
        if (p >= 40) return 'bg-amber-500';
        return 'bg-brand-500';
    }

    function render(data) {
        $('title').textContent = data.scope === 'project'
            ? (data.project ? data.project.name : 'Project')
            : (data.tenant_name || 'Dashboard');
        $('generated').textContent = 'Generated ' + new Date(data.generated_at).toLocaleString();
        if (data.scope === 'project') {
            renderProject(data);
        } else {
            renderDashboard(data);
        }
    }

    function renderDashboard(data) {
        $('body').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${data.projects.map(p => `
                    <div class="bg-white border border-ink-200/60 rounded-2xl p-5">
                        <div class="flex items-center justify-between">
                            <span class="text-[14px] font-semibold text-ink-800">${p.name}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase bg-ink-100 text-ink-500">${p.status}</span>
                        </div>
                        <div class="mt-3 h-2 rounded-full bg-ink-100 overflow-hidden">
                            <div class="h-full rounded-full ${progressColor(p.progress)}" style="width:${p.progress}%"></div>
                        </div>
                        <div class="mt-2 flex items-center justify-between text-[11px] text-ink-400">
                            <span>${p.done_items}/${p.total_items} items done</span>
                            <span class="font-semibold text-ink-600">${p.progress}%</span>
                        </div>
                    </div>`).join('')}
            </div>
            ${data.releases.length ? `
            <div class="bg-white border border-ink-200/60 rounded-2xl p-5">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-3">Recent releases</h2>
                <div class="space-y-2">${data.releases.map(r => `
                    <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-ink-100">
                        <span class="text-[13px] font-medium text-ink-800">${r.version} — ${r.name}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase bg-ink-100 text-ink-500">${r.status}</span>
                    </div>`).join('')}</div>
            </div>` : ''}
            ${data.activity.length ? `
            <div class="bg-white border border-ink-200/60 rounded-2xl p-5">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-3">Recent activity</h2>
                <div class="space-y-1.5">${data.activity.map(a => `
                    <div class="text-[12px] text-ink-600 px-3 py-1.5 rounded-lg bg-ink-50">${a.summary}</div>`).join('')}</div>
            </div>` : ''}`;
    }

    function renderProject(data) {
        const statusChips = Object.entries(data.backlog.by_status).map(([s, n]) =>
            `<span class="px-2 py-0.5 rounded-full bg-ink-100 text-ink-600 text-[11px] font-medium">${s}: ${n}</span>`).join(' ');
        $('body').innerHTML = `
            <div class="bg-white border border-ink-200/60 rounded-2xl p-5">
                <div class="flex items-center justify-between">
                    <span class="text-[14px] font-semibold text-ink-800">${data.project.name}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase bg-ink-100 text-ink-500">${data.project.status}</span>
                </div>
                ${data.project.description ? `<p class="text-[13px] text-ink-500 mt-2">${data.project.description}</p>` : ''}
                <div class="mt-4 h-2 rounded-full bg-ink-100 overflow-hidden">
                    <div class="h-full rounded-full ${progressColor(data.backlog.progress)}" style="width:${data.backlog.progress}%"></div>
                </div>
                <div class="mt-2 flex items-center justify-between text-[11px] text-ink-400">
                    <span>${data.backlog.total} items</span>
                    <span class="font-semibold text-ink-600">${data.backlog.progress}% done</span>
                </div>
                <div class="mt-3 flex flex-wrap gap-1.5">${statusChips}</div>
            </div>
            ${data.milestones.length ? `
            <div class="bg-white border border-ink-200/60 rounded-2xl p-5">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-3">Milestones</h2>
                <div class="space-y-2">${data.milestones.map(m => `
                    <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-ink-100">
                        <span class="text-[13px] font-medium text-ink-800">${m.title}</span>
                        <span class="text-[11px] text-ink-400">${m.target_date || ''} · ${m.status}</span>
                    </div>`).join('')}</div>
            </div>` : ''}
            ${data.releases.length ? `
            <div class="bg-white border border-ink-200/60 rounded-2xl p-5">
                <h2 class="text-[12px] font-semibold text-ink-500 uppercase tracking-wide mb-3">Releases</h2>
                <div class="space-y-2">${data.releases.map(r => `
                    <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-ink-100">
                        <span class="text-[13px] font-medium text-ink-800">${r.version} — ${r.name}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase bg-ink-100 text-ink-500">${r.status}</span>
                    </div>`).join('')}</div>
            </div>` : ''}`;
    }

    $('pw-btn').addEventListener('click', () => {
        const pw = $('pw').value;
        load(pw).then((data) => {
            if (!data) {
                $('pw-error').textContent = 'Incorrect password — try again.';
                $('pw-error').classList.remove('hidden');
            }
        });
    });

    load();
    </script>
</body>
</html>

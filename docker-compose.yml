# PMO System — Docker Compose
# Usage: docker compose up

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PMO_DATABASE_URL=postgresql://pmo:pmo_pass@db:5432/pmo_system
      - PMO_ENV=development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # hot reload in dev
    command: >
      gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000 --access-logfile - --error-logfile -
      --reload  # auto-reload on code changes (dev only)

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pmo
      POSTGRES_PASSWORD: pmo_pass
      POSTGRES_DB: pmo_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmo -d pmo_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

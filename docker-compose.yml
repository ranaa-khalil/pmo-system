# PMO System — Docker Compose
# Usage: docker compose up

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PMO_DATABASE_URL=postgresql://pmo:pmo_pass@db:5432/pmo_system
      - PMO_ENV=development
      - PMO_SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pmo
      POSTGRES_PASSWORD: pmo_pass
      POSTGRES_DB: pmo_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmo -d pmo_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

# Render Blueprint — PMO System deployment
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pmo-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    env: python
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PMO_SECRET_KEY
        generateValue: true
      - key: PMO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
